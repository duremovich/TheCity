# Living City Simulator tuning. Every constant the simulation uses lives here.
# See docs/SPEC.md › Tuning defaults for what to raise or lower and when.

[world]
# M10: the 256 x 192 map (assets/map_v1.txt is the 96 x 64 v1 city; unit tests use Config::v1_profile).
map = "map.txt"
# M10: 2,000 residents (400 Blocks x 5). v1 was 300.
population = 2000
residents_per_home = 5
spouse_p = 0.6
age_min_years = 18.0
age_max_years = 60.0
initial_coins_min = 10
initial_coins_max = 40
initial_food_min = 0
initial_food_max = 2
skill_min = 0.1
skill_max = 0.4
home_pantry_initial = 10
# M10 (2,000 residents): per Market (three of them); v1 600 for one.
market_initial = 1500
# M10: v1 1500. The Reserve Depot holds 20,000.
warehouse_initial = 10000
# M10: v1 5000, scaled for ~6.7x the payroll and dole.
treasury_initial = 35000
price_initial = 3
# M11 (VISION "Brutality, enhancement and status": a deeply unequal city from day one): the initial
# coin draw is multiplied by the Home's tier, Sump / Mid / Spire. v1_profile keeps [1, 1, 1].
coins_by_tier = [0.5, 1.0, 3.0]
# tick_of_day ranges [start, end): Work phase 6 days in 7; guards with an even index work nights.
shift_day = [[540, 1080]]
shift_night = [[1260, 1440], [0, 360]]

# M10 (2,000 residents): v1 24 / 10 / 3 / 2 / 1. Four clerks per Market, eight bartenders over three
# Bars, 16 farmers per Vat Farm; the rest draw the dole.
[world.jobs]
farmer = 160
guard = 36
clerk = 12
bartender = 8
gravedigger = 4

[world.needs_initial]
hunger = 0.8
energy = 0.9
safety = 0.8
belonging = 0.6
intimacy = 0.5

# Capacity = max agents inside at once; stock_cap = food units the building can hold.
[buildings]
home = { capacity = 6, stock_cap = 30 }
# M10: farm 16 (160 farmers / 12 farms; v1 12), jail 80 (v1 16), hideout 30 (60 members; v1 12),
# warehouse stock_cap 20,000 (v1 3000). Lots and Security Offices are inert until M11.
# M11 D17: staff = full staff of an owned niche building (Grow tops vacancies up to it; an
# agent-owned Bar below it posts a bartender vacancy daily).
farm = { capacity = 16, stock_cap = 400, staff = 14 }
market = { capacity = 20, stock_cap = 2000, staff = 4 }
bar = { capacity = 24, stock_cap = 0, staff = 3 }
jail = { capacity = 80, stock_cap = 0 }
cemetery = { capacity = 8, stock_cap = 0 }
hall = { capacity = 20, stock_cap = 0 }
hideout = { capacity = 30, stock_cap = 200 }
warehouse = { capacity = 6, stock_cap = 20000 }
security_office = { capacity = 12, stock_cap = 0 }
lot = { capacity = 0, stock_cap = 0 }

[needs]
hunger_decay_per_tick = 0.000347
# 0.000926 (18 h awake) on paper; with an 8 h sleep that is a 26 h cycle and workers nod off mid-shift.
# 0.000694 (24 h) locks sleep to the night.
energy_decay_per_tick = 0.000694
safety_recover_per_tick = 0.0010
belonging_decay_per_tick = 0.000139
intimacy_decay_per_tick = 0.0000694
# 7 on paper; at 7 a typical starting wallet (10-40 coins at price 3) reads as secure, half the
# workforce idles until the Market empties, and farmers abandon shifts for snacks. 30 gives Work the
# U(wealth) the spec's worked example assumes (~0.87) for a wallet of a few days' wages.
wealth_days_secure = 30.0
food_satisfy = 0.5
sleep_ticks_full = 480
chat_belonging = 0.3
starvation_grace_ticks = 4320

[economy]
price_base = 3.0
# The spec's 600 assumed a 600-unit Market; with farm_yield_base 2.4 the shelf sits at ~1500-1900,
# so at 600 the price was pinned at 2 all year, the Treasury could not cover wages plus dole, and the
# first price signal of a Winter famine was the 2 -> 28 cliff on the day the shelf hit zero.
# 1500 puts the price at 3 in normal times and lets it climb through 4, 6, 9 as Winter draws it down.
price_ref_stock = 1500.0
price_min_stock = 7
price_cap = 30
wage_farmer = 6
wage_guard = 8
wage_clerk = 6
wage_bartender = 5
wage_gravedigger = 5
# 1.4 on paper assumes 24 farmers x 9 h at farming 0.5 and one meal per citizen. In practice farms
# work 6 days in 7, farmers attend ~75% of a shift (meals, wage trips), initial farming skill is
# U(0.1, 0.4) (x0.8) and citizens eat ~1.2 meals a day, so ~380 food/day is needed. 2.4 keeps the
# Market stocked but not flooded (2.8 left nobody ever broke, so no crime; the spec's 1.25 starves
# the town by day 14); Summer (x1.4) fills the stores and Winter (x0.3) is still a famine by design.
farm_yield_base = 2.4
farm_skill_floor = 0.6
farm_skill_slope = 0.8
season_mult = [1.0, 1.4, 1.1, 0.8]
energy_decay_mult = [1.0, 1.0, 1.0, 1.15]
spoilage_pantry = 0.05
spoilage_market = 0.01
haul_batch = 50
haul_min_stock = 10
# Deviation from the spec (which has no automatic Warehouse -> Market transfer): without it the
# Summer surplus overflows a full Warehouse and is lost, then ~2000 units rot in it while the
# Market stands empty for the last ten days of Winter. The floor is well under price_ref_stock, so
# Winter still pushes the price to ~6-7; the player's Release reserve lever remains the only way
# to flood the shelf and bring the price back down. 0 restores the spec behaviour.
# M10: per Market now (three of them, 2,000 residents); v1 400 / 200 for one Market and 300.
# 1200 / 1200, not the plan's 900 / 450: every Vat Farm's nearest Market is the Civic one (the
# farms tie on door distance and the lower index wins), so the two Mid Markets are fed by restock
# alone. At 450 a day they were empty from day 3, the Reserve sat full at 20,000, and by day 9
# eighty hungry thieves filled the Jail. A floor of 1200 carries a Market's daily demand and still
# prices at 3; Winter drains the Reserve and the price climbs as before.
restock_floor = 1200
restock_batch = 1200
build_home_cost = 200
# M11 D27: an exec's daily draw from their corp.
wage_exec = 10

[crime]
steal_base_cost = 8.0
steal_lawfulness_factor = 20.0
steal_guard_penalty = 6.0
steal_starving_bonus = 4.0
steal_dark_bonus = 3.0
beg_base_cost = 5.0
beg_pride_factor = 10.0
forage_base_cost = 6.0
witness_base = 0.6
witness_stealth_factor = 0.5
witness_guard_bonus = 0.3
sight = 6
sight_day_crime = 8
sight_night_crime = 4
sentence_days = [3, 6, 10, 30]
# jail capacity is buildings.jail.capacity
fight_death_p = 0.03
stat_theft_caught_p = 0.25
warrant_expiry_days = 30
suspect_seen_ticks = 240
patrol_legs_per_shift = 5
fine_mult = 2

[social]
edge_create_ticks = 30
affinity_per_hour = 0.05
friend_threshold = 0.4
rival_threshold = -0.3
enemy_threshold = -0.6
propose_affinity = 0.6
propose_trust = 0.5
gang_stipend = 4
extort_amount = 5
join_gang_affinity = 0.4
join_gang_desperation_hunger = 0.2
join_gang_desperation_lawfulness = 0.3

[gangs]
# One gang per Hideout in map order: The Hollow holds the south-west corner, Ninefold the south-east.
names = ["The Hollow", "Ninefold"]
treasury_initial = [50, 50]
order_weight = 0.35
freelance_loyalty = 0.3
# v1 recruited on promise up to 3 and then asked the treasury to fund the whole roster. A gang of
# 3-5 sits at the stipend's break-even, so that left the loser of the first raid stuck for good and
# made growth hostage to a windfall. The promise now covers the first 5 for good; the treasury
# funds each member beyond them.
# M10: 15 (was 5). At 2,000 residents both gangs stalled at 5-6 members all year (the stipend
# break-even), never touched each other's turf across the Sump and the M8 gate saw no flip or
# cross-gang fight; 15 lets them reach ~16 each. (10 was path-dependent and stalled at ~10.)
recruit_on_promise = 15
# Members are never Statistical now, so every one of them extorts daily and the revenge fights
# scale with headcount: an uncapped gang reached 29 and 7 Assaults/day (the M7 baseline is 3).
# M10: 60 (v1 20) for 2,000 residents; still two gangs.
max_members = 60
# 4: with 7, a burst of arrests kept a gang lying low for weeks (and lying low earns nothing).
heat_days = 4
hysteresis = 0.10
contest_min_ratio = 0.8
raid_min_ratio = 1.2
# Gang treasuries run at 0-30 (the stipend eats the tribute); 40 meant no raid was ever worth it.
# At 10 a strong gang raids a few times a season; the cooldown caps the pace.
raid_min_prize = 10
# 30: Retaliate obeys the cooldown too, and at 10 every sack bred a counter-sack five days later
# (17 raids on seed 42 against the spec's 2-6). A raid a season per gang.
raid_cooldown_days = 30
raid_prize_frac = 0.5
raid_muster_hour = 22
# M10: 8 (was 3). On the 256 x 192 map a member can be 6 h from the Hideout, so with 3 h the muster
# left without them and raiders reached the door one at a time.
raid_gather_hours = 8
raid_gather_radius = 6
retaliate_days = 3
sacked_days = 3
# 0.5: one arrest (0.3) alone no longer forces a rethink; two in a day, or any death, does.
shock_severity_rethink = 0.5
# M9: this many members (at most half the gang, newest first, rotating daily) sleep at the Hideout
# each night, so a raid meets defenders. In M8 every raid found the Hideout empty and sacked it.
# 4 (was 2): after phases 2-4 changed who is jailed or mustering, 2 left every seed-42 raid a sack (0 of 5 met a defender); 4 meets 3 of 5.
night_watch = 4
# M9 breakouts (docs/M9_LAW.md): a cooldown of their own, the fit headcount needed to try, and how
# many convicts one breach frees. The boss sitting inside doubles the pull (a consideration, not a flat).
breakout_cooldown_days = 15
breakout_min_members = 2
breakout_max_freed = 3

# Flat terms on each order's score (product of considerations + flat). Retaliate's 0.6 lets a
# grudge beat Expand for any leader with greed < 1; LieLow's 0.15 keeps it always available;
# Contest's 0.1 lets the stronger gang turn on the border once its own side is claimed; Raid's
# 0.3 makes a 3:2 edge over a rival with a few coins worth the march (the cooldown paces it).
[gangs.order_flat]
expand = 0.05
contest = 0.1
raid = 0.3
retaliate = 0.6
lielow = 0.15
breakout = 0.28 # was 0.2: after the M9 review fixes (jail duty by rank, Hideout sleep, night watch) 0.2 produced no breakout on seed 42

# M9: the law as a faction (docs/M9_LAW.md). A captain (the most lawful guard) scores Patrol,
# Crackdown (on the most-reported gang: patrol loops through its turf, one guard in three holds the
# Jail) and Garrison (every guard holds the Jail) daily and on shocks.
[law]
window_days = 7
crackdown_reports = 6
garrison_days = 7
hysteresis = 0.10
shock_severity_rethink = 0.5
min_guards = 2
incorruptible = 0.8
bribe_base = 10
bribe_per_guard = 1
bribe_days = 10
bribe_threshold = 0.35
target_margin = 2
# M10: a patrol loop's two Homes come from this many nearest its Market (one of three, drawn per
# loop). 60 is the whole v1 city; on the 256 x 192 map a loop over all 400 Homes could not be walked
# in a shift, so guards on patrol were never credited a shift and starved on full pay.
patrol_beat_homes = 60
# M10: a guard chases only warrants last seen within this many tiles (v1: no limit). On the 256 x 192
# map, with a warrant always open somewhere among 2,000 residents, every guard spent a fifth of the
# day walking across the city after the nearest one, was never credited a shift, and starved.
pursuit_radius = 64
# M10 phase 5c: a guard is owed a shift on law duty (Patrol, Arrest, Work on a Jail day) for at least
# this share of it, or completed (five legs, a held Jail), judged by the clock when the shift ends.
# Owing the day only to a PatrolLeg at the end or an arrest left 412 of 584 shifts unpaid; owing it
# for the goal held at the last tick still left most shifts spent 60-100 % on duty unpaid.
shift_duty_share = 0.5

# Patrol's 0.2 keeps it the resting posture; Crackdown earns its place from pressure alone (+0.3
# while a refused bribe hardens it); Garrison's 0.05 (+0.5 for a week after a jailbreak).
[law.posture_flat]
patrol = 0.2
crackdown = 0.0
garrison = 0.05

[demography]
birth_p_per_day = 0.004
old_age_days = 10800
old_age_p_per_day = 0.01
emigrate_mood = -0.8
emigrate_days = 7

[brain]
memory_cap = 24
memory_half_life_days = 7.0
goal_hysteresis = 0.10
# Raising this to stop Bar retries costs whole shifts: two failed wage trips at a full Hall cooled
# Work for the morning. The planner now refuses a visibly full Bar instead.
goal_cooldown_ticks = 120
think_interval_ticks = 30
plan_budget_per_tick = 12
plan_max_expansions = 200
plan_max_len = 6
plan_timeout_ticks = 900
plan_expansion_budget_per_tick = 600
path_budget_per_tick = 20
mood_w_need = 0.7
mood_w_memory = 0.3

[exec]
move_ticks_full = 2
interrupt_check_ticks = 30
door_capacity_per_tick = 2
door_queue_max_ticks = 30
reservation_ttl = 120
# M10: 16000 (v1 4000) for the 256 x 192 map; street targets can be 300+ tiles away.
astar_max_expansions = 16000
# M10: lazy flow fields kept in an LRU of this many (49 KB each); every real destination fits.
flow_field_cache = 512

[lod]
max_full = 50
# M10: 150 (v1 100). Guards now get gang members' priority; without the room 120 gang members take
# every slot and the whole watch is Statistical.
max_coarse = 150
# M10: days of per-adult Trace kept (the binder and the biography read it).
trace_days = 120
# M10 D26: multiplies the table's p_robbed / p_assaulted / p_killed at use; the knob if off-screen
# violence falls short of the M10 scenario. The parity test pins it to 1.0.
stat_violence_mult = 1.0

# M10 holes and the binder (docs/M10_SCALE.md § 3). Weight per candidate:
# (1 - lawfulness)^lawfulness_power x (1 + gang_claim_mult*gang*claims) x (1 + enemy_mult*enemy) x (1 + statistical_mult*stat),
# x other_zone_weight off-zone. p_unknown is drawn first ("nobody ever learns who", D11).
[bind]
hole_ttl_days = 30
max_open_per_agent = 8
p_unknown = 0.30
p_witness = 0.25
coverage_min = 0.5
coverage_max = 2.0
gang_claim_mult = 2.0
# M10 phase 5c, tuned by the parity test's actor shares (spec § 3): v2 1.0 (was 3.0). Full crime per
# head is flat across lawfulness (thefts .24/.52/.25 by bucket against a population of .22/.57/.21;
# assaults and robberies are revenge-, gang- and hunger-driven), so the old weights pinned bound
# crime on the lawless: law0 .34 against Full's .23, law2 .16 against .26. At power 0, enemy_mult 3
# still leaves law2 at .205 (tolerance .05); 1.0 keeps a revenge tilt and passes (.214).
enemy_mult = 1.0
statistical_mult = 0.5
other_zone_weight = 0.25
# M10 phase 5c: 0.0 (spec default 2.0; serde default 2.0 for older saves). See enemy_mult: in Full,
# lawfulness does not predict who robs or beats someone, so the binder does not weigh it either.
lawfulness_power = 0.0

# M11 rent (docs/M11_OWNERSHIP.md § 4; plan D6/D7). Rent is per Home per day by tier
# (0 Sump, 1 Mid, 2 Spire), split equally among the Home's adult residents. The city's own Blocks
# charge levers.city_rent (initially this base); a corp's charge base x its Housing price level.
[rent]
# M11 phase 2: [0, 1, 2], not the spec's [1, 2, 4]. Seed 42, 2,000, 60 days each (M10-off control:
# 2,897 thefts, 33 gang members, 8,823 ticks/s): [1, 2, 4] 8,209 thefts, 87 members, 7,037 ticks/s;
# [1, 1, 1] 5,573 / 88 / 7,381; [0, 1, 2] 3,861 / 38 / 7,778. With the dole at 3 and food at 3 the
# dole is exactly a meal, so any coin of rent from the 80 % on it is a meal skipped, hungry adults
# steal and join gangs, and the bodies that buys sank throughput under the 8,000 gate. A Sump Block
# is rent-free (a Dreg on the dole can afford tier 0); the dole at 4 with [1, 2, 4] also held theft
# at 2,808 but cost the Treasury 500 a day. Phase 3 note: Squeeze cannot raise a 0 base.
base = [0, 1, 2]
evict_days = 7
rehouse_coins_mult = 3   # a homeless adult moves in with coins >= 3 x the Home's rent
refuse_days = 30
sump_spoilage_mult = 1.5 # tier-0 pantries spoil this much faster
# M11 phase 2 (seed 42, 2,000): with rent taken only from what is left at midnight, the 89 % on the
# 3-coin dole (price 3) reach midnight with 0 coins once their opening savings are gone (mean 12 at
# day 4, 2 at day 24): 600 adults were short every night and 118 were evicted on day 25 alone, against
# a target of 10-40 in 120 days. Paying the due rent out of the dole or a wage when it is collected
# (rent before food) leaves eviction to those with no income for a week: the jailed, the unpaid, and
# everyone once the Treasury cannot pay the dole.
pay_from_income = true
# The jailed: arrears do not count while inside (the debt still runs and is paid on release). Without
# that, 50 of 67 evictees in 60 days were prisoners and their spouses went with them.

[corps]
# placeholders; one row per corp, niches as a list, holdings as counts per niche kind
names    = ["Nutrix", "Vatra", "Greenline", "Habitat", "Stackwell", "Kessler", "Arasaka", "Militech"]
niches   = [["Food"], ["Food", "Housing"], ["Food"], ["Housing"], ["Housing"], ["Housing"], ["Security"], ["Security", "Housing"]]
farms    = [6, 4, 2, 0, 0, 0, 0, 0]
markets  = [1, 1, 1, 0, 0, 0, 0, 0]
blocks   = [0, 60, 0, 120, 60, 20, 0, 40]
offices  = [0, 0, 0, 0, 0, 0, 1, 1]
treasury_initial = [6000, 5000, 2500, 8000, 4000, 1500, 4000, 3000]
bar_owner_coins = 200
hoard_heat = 5000                  # a corp treasury above this is a raid prize in the gang brain
acquire_premium = 1.2              # offer = value × premium
acquire_cooldown_days = 10
undercut_floor = 0.6               # price_level cannot be undercut below this
hysteresis = 0.10
shock_severity_rethink = 0.5
bankrupt_days = 14
incorporate_buildings = 2         # an agent owning this many becomes a corp
found_cost = { bar = 300, home = 400 }
wholesale = 2                      # coins per unit Farm → Market when owners differ
contract_per_guard_day = 10
security_guards = 6
lobby_min_treasury = 400
monopoly_markup_cap = 2.0          # price_level ceiling with a monopoly; 1.5 without
# --- M11 plan additions (decisions D4, D11, D15, D17-D25, D28, D33, D41, D48) ---
bar_owner_count = 2
# D4: the Treasury's return flow. M11 phase 2, from the ledger columns over 120 days (seed 42, 2,000):
# the plan's { farm 120, home 3, security_office 60 } left the Treasury -1,140 a day from day 15 (the
# city buys Farm overflow into the Reserve at wholesale, ~1,200 a day, and the dole grows to ~4,900 as
# opening savings run out) and broke it on day 45, so the dole stopped. Farm upkeep carries it, since
# the overflow it pays for is per Farm: 250 overshot (+800 a day, Vatra and Greenline bled out), 215
# with home 3 held days 15-45 flat. With rent [0, 1, 2] a Block earns 0-2, so home 3 bled every
# landlord (Militech 79 a day per 1,000 of treasury against the plan's 50 limit): home 1 and
# security_office 30, and farm 245 makes up the Treasury's share. Result: Treasury 34,618 -> 49,191 in
# 120 days (+121 a day; flat to day 60, then the debt of corps below zero lifts it: no bankruptcy yet).
upkeep = { farm = 245, market = 600, bar = 15, home = 1, security_office = 30 }
value = { farm = 1000, market = 1000, security_office = 500 }                    # D28
shop_price_tiles = 12              # D15: one coin of price is worth 12 tiles of walking
grow_cooldown_days = 7             # D23
secure_per_day = 2                 # D24
private_pursuit_radius = 16        # D18
found_cooldown_days = 10           # D26
residents_per_bar = 300            # D25
hoard_tilt = 0.1                   # D33
megacorp = [false, false, false, false, false, false, true, true]  # D41
outside_treasury_initial = 100000

[corps.order_flat]                 # D48
grow = 0.0
squeeze = 0.0
undercut = 0.0
acquire = 0.0
secure = 0.0
hunker = 0.15
lobby = 0.0

[levers]
tax_rate = 0.05
sentence_mult = 1.0
# M10 (2,000 residents): v1 10 and 2. The daily reconcile fires down to the lever, so it must match
# [world.jobs] guard.
guard_count = 36
immigration_per_week = 13
# 3 = one meal at price 3; the unemployed need ~1.2 meals a day, so some go hungry, and the hungry
# poor steal (M3's point). At 4 nobody ever steals.
dole_per_day = 3
