# M12 phase 4: 0 -> 0.2 (spec § 5). The tilt now lands on the corp-building Raid (plan D39) and no
# longer on Contest (faction::score_orders: Contest reads it only with corp raids off, the M11 brain).
hoard_tilt = 0.2
megacorp = [false, false, false, false, false, false, true, true, false]  # D41; M13 D17 row 9
outside_treasury_initial = 100000
# M11 phase 5, the estate rule (diagnosis item 24): a bankruptcy estate's building goes only to a corp
# already in its niche holding under half of it (Nutrix, a Food corp, bought 60 Blocks of a dead
# landlord; the richest corp swallowed every estate), and one buyer takes at most estate_buyer_cap
