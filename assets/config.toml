names    = ["Nutrix", "Vatra", "Greenline", "Habitat", "Stackwell", "Kessler", "Arasaka", "Militech", "Zetatech"]
niches   = [["Food"], ["Food", "Housing"], ["Food"], ["Housing"], ["Housing"], ["Housing"], ["Security"], ["Security", "Housing"], ["Tech"]]
farms    = [6, 4, 2, 0, 0, 0, 0, 0, 0]
markets  = [1, 1, 1, 0, 0, 0, 0, 0, 0]
blocks   = [0, 60, 0, 120, 60, 20, 0, 40, 0]
offices  = [0, 0, 0, 0, 0, 0, 1, 1, 0]
treasury_initial = [6000, 5000, 2500, 8000, 4000, 1500, 4000, 3000, 5000]
bar_owner_coins = 200
hoard_heat = 5000                  # a corp treasury above this is a raid prize in the gang brain
acquire_premium = 1.2              # offer = value × premium
acquire_cooldown_days = 10
undercut_floor = 0.6               # price_level cannot be undercut below this
hysteresis = 0.10
shock_severity_rethink = 0.5
# M11 phase 3: 14 -> 3. A corp in the red pays nobody (wages, restock), so its workers walk out and
# its Market's shelf empties (price 30) for as long as it lingers; at 14 the seed-42 run had thefts
# x4 and the M10 throughput gate fell to 5.6k ticks/s, at 7 to 6.9k. At 3 it is sold off (to the city
# at worst, which runs it as in v1) before its workers' wages are a week late.
bankrupt_days = 3
incorporate_buildings = 2         # an agent owning this many becomes a corp
# M11 phase 4: bar 300 -> 200. Seed 42, 2,000, 120 days: wages (5-8) are all above the dole, so only
# the jobless can found, and at 300 never more than two jobless non-execs held 300 at once (most of the
# city's coins sit with the employed and the execs): 3 NPC Bars from day 91 and no incorporation. At
# 200 6 NPC foundings from day 28 and the first incorporation on day 28; at 150 15 foundings (12 Bars
# by day 80, a third of them in a fortnight). Home stays 400 (its value is the Block sale price, D28).
found_cost = { bar = 200, home = 400, hotel = 250, clinic = 500, garage = 600, lab = 800, feed = 500, mission = 150, camp = 600 }  # M12 D20: hotel; M13 D16: clinic, garage; M14: lab (Research only); M15: feed; Real economy E26, E37: mission, camp
wholesale = 2                      # coins per unit Farm → Market when owners differ
# M11 phase 5: 10 -> 20, with upkeep.security_office 30 -> 10. A Security corp costs its Office's
# upkeep, six guards' wages (48) and its exec (10) a day, ~88 at the old sizes against 6-10 a contract
# (Undercut races both to the 0.6 floor): Arasaka could not live on any number of clients it could
# get and died near day 75 on every seed. Now 68 a day: break-even at 3.4 contracts at level 1.0 and
# 5.7 at the floor.
contract_per_guard_day = 20
security_guards = 6
lobby_min_treasury = 400
# M11 phase 3 set both Squeeze ceilings to 1.15 (spec: 2.0 with a monopoly, 1.5 without): the dole
# was one meal at price 3, so any Food markup that rounded 3 up to 4 was a skipped meal for every dole
# agent, and a Winter Food monopoly at the spec caps ran thefts to 3,800 per 10 days. M11 phase 5: the
# dole is 4 (a coin of slack), prices keep their tenths and customers walk to a cheaper Market, so the
# spec caps are back.
monopoly_markup_cap = 2.0          # price_level ceiling with a monopoly
squeeze_cap = 1.5                  # price_level ceiling without a monopoly
# --- M11 plan additions (decisions D4, D11, D15, D17-D25, D28, D33, D41, D48) ---
bar_owner_count = 2
# D4: the Treasury's return flow. M11 phase 2, from the ledger columns over 120 days (seed 42, 2,000):
# the plan's { farm 120, home 3, security_office 60 } left the Treasury -1,140 a day from day 15 (the
# city buys Farm overflow into the Reserve at wholesale, ~1,200 a day, and the dole grows to ~4,900 as
# opening savings run out) and broke it on day 45, so the dole stopped. Farm upkeep carries it, since
# the overflow it pays for is per Farm: 250 overshot (+800 a day, Vatra and Greenline bled out), 215
# with home 3 held days 15-45 flat. With rent [0, 1, 2] a Block earns 0-2, so home 3 bled every
# landlord (Militech 79 a day per 1,000 of treasury against the plan's 50 limit): home 1 and
# security_office 30, and farm 245 makes up the Treasury's share. Result: Treasury 34,618 -> 49,191 in
# 120 days (+121 a day; flat to day 60, then the debt of corps below zero lifts it: no bankruptcy yet).
# M11 phase 3: Block upkeep by tier (Sump, Mid, Spire), was a flat 1. With [rent] base [0, 1, 2] a
# Sump Block earns nothing, so a flat 1 made every Sump landlord (Kessler: 20 Sump Blocks only;
# Stackwell and Militech: 40 each) go bankrupt by arithmetic, not by play. Upkeep now matches the
# tier's base rent: a free Sump Block costs its owner nothing. Corp Block upkeep goes from 300 to
# 260 a day (Habitat's 60 Spire Blocks now pay 2).
# M11 phase 5: security_office 30 -> 10 (see contract_per_guard_day).
# M12 fix pass: hotel 10 -> 4. A Hotel books 2-3 nights a day at 3 coins (5-7 hotel nights a day
# city-wide over 2-3 Hotels, seeds 42-44), ~7 gross and ~6 after tax: at 10 every Hotel owner bled.
# M14 V47 (phase 1): lab 15 -> 0 (third knob; see wage_researcher).
# M15 phase 4: feed 10 -> 0 (as the Lab's in M14 V47): with one Reporter a Feed then nets ~0 a day on ads.
upkeep = { farm = 245, market = 600, bar = 15, home = [0, 1, 2], security_office = 10, hotel = 4, clinic = 10, garage = 10, lab = 0, feed = 0, mission = 0, camp = 2 }  # Real economy E26, E37: a city Mission pays none; a corp's Camp 2 (phase 2's property_rate.camp mirrors it)
# M12 fix pass: a corp raided (or looted by a riot) in the last raided_days reads Secure/Lobby
# `losses` of at least raided_losses: it hardens (contracts the building, or lobbies on the gang).
raided_days = 7
raided_losses = 0.5
value = { farm = 1000, market = 1000, security_office = 500, clinic = 600, garage = 800, lab = 1200, feed = 800, mission = 300, camp = 800 }  # D28; M13 D16; M14; M15; Real economy E26, E37
shop_price_tiles = 12              # D15: one coin of price is worth 12 tiles of walking
