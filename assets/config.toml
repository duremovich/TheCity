# Living City Simulator tuning. Every constant the simulation uses lives here.
# See docs/SPEC.md › Tuning defaults for what to raise or lower and when.

[world]
population = 300
residents_per_home = 5
spouse_p = 0.6
age_min_years = 18.0
age_max_years = 60.0
initial_coins_min = 10
initial_coins_max = 40
initial_food_min = 0
initial_food_max = 2
skill_min = 0.1
skill_max = 0.4
home_pantry_initial = 10
market_initial = 600
warehouse_initial = 1500
treasury_initial = 5000
price_initial = 3
gang_name = "The Hollow"
gang_treasury_initial = 50
# tick_of_day ranges [start, end): Work phase 6 days in 7; guards with an even index work nights.
shift_day = [[540, 1080]]
shift_night = [[1260, 1440], [0, 360]]

[world.jobs]
farmer = 24
guard = 10
clerk = 3
bartender = 2
gravedigger = 1

[world.needs_initial]
hunger = 0.8
energy = 0.9
safety = 0.8
belonging = 0.6
intimacy = 0.5

# Capacity = max agents inside at once; stock_cap = food units the building can hold.
[buildings]
home = { capacity = 6, stock_cap = 30 }
farm = { capacity = 12, stock_cap = 400 }
market = { capacity = 20, stock_cap = 2000 }
bar = { capacity = 24, stock_cap = 0 }
jail = { capacity = 16, stock_cap = 0 }
cemetery = { capacity = 8, stock_cap = 0 }
hall = { capacity = 20, stock_cap = 0 }
hideout = { capacity = 12, stock_cap = 200 }
warehouse = { capacity = 6, stock_cap = 3000 }

[needs]
hunger_decay_per_tick = 0.000347
# 0.000926 (18 h awake) on paper; with an 8 h sleep that is a 26 h cycle and workers nod off mid-shift.
# 0.000694 (24 h) locks sleep to the night.
energy_decay_per_tick = 0.000694
safety_recover_per_tick = 0.0010
belonging_decay_per_tick = 0.000139
intimacy_decay_per_tick = 0.0000694
# 7 on paper; at 7 a typical starting wallet (10-40 coins at price 3) reads as secure, half the
# workforce idles until the Market empties, and farmers abandon shifts for snacks. 30 gives Work the
# U(wealth) the spec's worked example assumes (~0.87) for a wallet of a few days' wages.
wealth_days_secure = 30.0
food_satisfy = 0.5
sleep_ticks_full = 480
chat_belonging = 0.3
starvation_grace_ticks = 4320

[economy]
price_base = 3.0
price_ref_stock = 600.0
price_min_stock = 7
price_cap = 30
wage_farmer = 6
wage_guard = 8
wage_clerk = 6
wage_bartender = 5
wage_gravedigger = 5
# 1.4 on paper assumes 24 farmers x 9 h at farming 0.5 and one meal per citizen. In practice farms
# work 6 days in 7, farmers attend ~75% of a shift (meals, wage trips), initial farming skill is
# U(0.1, 0.4) (x0.8) and citizens eat ~1.2 meals a day, so ~380 food/day is needed. 2.4 keeps the
# Market stocked but not flooded (2.8 left nobody ever broke, so no crime; the spec's 1.25 starves
# the town by day 14); Summer (x1.4) fills the stores and Winter (x0.3) is still a famine by design.
farm_yield_base = 2.4
farm_skill_floor = 0.6
farm_skill_slope = 0.8
season_mult = [1.0, 1.4, 1.1, 0.3]
energy_decay_mult = [1.0, 1.0, 1.0, 1.15]
spoilage_pantry = 0.05
spoilage_market = 0.01
haul_batch = 50
haul_min_stock = 10
build_home_cost = 200

[crime]
steal_base_cost = 8.0
steal_lawfulness_factor = 20.0
steal_guard_penalty = 6.0
steal_starving_bonus = 4.0
steal_dark_bonus = 3.0
beg_base_cost = 5.0
beg_pride_factor = 10.0
forage_base_cost = 6.0
witness_base = 0.6
witness_stealth_factor = 0.5
witness_guard_bonus = 0.3
sight = 6
sight_day_crime = 8
sight_night_crime = 4
sentence_days = [3, 6, 10, 30]
# jail capacity is buildings.jail.capacity
fight_death_p = 0.15
stat_theft_caught_p = 0.25
warrant_expiry_days = 30
suspect_seen_ticks = 240
patrol_legs_per_shift = 5
fine_mult = 2

[social]
edge_create_ticks = 30
affinity_per_hour = 0.05
friend_threshold = 0.4
rival_threshold = -0.3
enemy_threshold = -0.6
propose_affinity = 0.6
propose_trust = 0.5
gang_stipend = 4
extort_amount = 5
join_gang_affinity = 0.4
join_gang_desperation_hunger = 0.2
join_gang_desperation_lawfulness = 0.3

[demography]
birth_p_per_day = 0.004
old_age_days = 10800
old_age_p_per_day = 0.01
emigrate_mood = -0.8
emigrate_days = 7

[brain]
memory_cap = 24
memory_half_life_days = 7.0
goal_hysteresis = 0.10
# Raising this to stop Bar retries costs whole shifts: two failed wage trips at a full Hall cooled
# Work for the morning. The planner now refuses a visibly full Bar instead.
goal_cooldown_ticks = 120
think_interval_ticks = 30
plan_budget_per_tick = 12
plan_max_expansions = 200
plan_max_len = 6
plan_timeout_ticks = 900
plan_expansion_budget_per_tick = 600
path_budget_per_tick = 20
mood_w_need = 0.7
mood_w_memory = 0.3

[exec]
move_ticks_full = 2
interrupt_check_ticks = 30
door_capacity_per_tick = 2
door_queue_max_ticks = 30
reservation_ttl = 120
astar_max_expansions = 4000

[lod]
max_full = 50
max_coarse = 100

[levers]
tax_rate = 0.05
sentence_mult = 1.0
guard_count = 10
immigration_per_week = 2
# 3 = one meal at price 3; the unemployed need ~1.2 meals a day, so some go hungry, and the hungry
# poor steal (M3's point). At 4 nobody ever steals.
dole_per_day = 3
