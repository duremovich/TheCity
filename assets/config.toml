# L2 § 3 faction violence off screen (phase 4). Every number is a placeholder (phase 5 calibrates;
# if Murders break the bound, fv_mult falls first, never an M8-M15 knob).
[fviolence]
enabled = true
rate_days = 14                       # days of the ledger's windows the rates read
prior_weight = 48.0                  # body-days of evidence the prior is worth (placeholder)
# fv_mult: the knob the Murder bound pulls (placeholder, a phase-4 finding). At the spec's 1.0 the
# priors drive the off-screen tier: on 42-47 (120 days) Murders summed 598 against the M15 bound of
# 1.25 x 315 = 394 (0.5: 450; 0.3: 352), and civilians were hit off screen 5-6x as often as civilian
# bodies were by on-screen faction violence (2.2 vs 0.4 per 1,000 agent-days; 0.3: 0.63 vs 0.52).
fv_mult = 1.0                        # phase 5: 0.3 -> 1.0, the per-class priors below carry it
day_cap = { killed = 3, assaulted = 12, robbed = 20, abducted = 2 }   # city-wide per day (placeholders)
# per agent-day [Killed, Assaulted, Robbed, Abducted] (placeholders, the spec's)
prior = { order = [0.0003, 0.002, 0.003, 0.0], vendetta = [0.0004, 0.002, 0.0, 0.0], riot = [0.001, 0.01, 0.01, 0.0], episode = [0.0005, 0.003, 0.0, 0.0], harvest_abducted = 0.0004 }
# L2 phase 5 calibration (b): a prior per VictimClass, as per-kind multipliers [K, A, R, Ab] of every
# source's prior, from the on-screen ledger pooled over 42-47 (120 days, the calibrated wage city, fv_mult
# 0.3): civilians K 3 / A 24 / R 2 victims over 87,335 body-days (0.034 / 0.27 / 0.023 per 1,000: the
# order prior's 0.3 / 2 / 3 is 9x / 7x / 130x too high), members K 185 / A 3,961 / R 113 over 152,190
# (1.22 / 26.0 / 0.74: 4x / 13x / 0.25x), the watch K 26 / A 492 / R 5 over 40,322 (0.65 / 12.2 / 0.12:
# 2.2x / 6.1x / 0.04x). Abducted keeps the Harvest prior (only Harvest abducts).
# Members' Assaulted 13 -> 6.5: at the ledger's 13x the off-screen beatings of members fed grudges into
# vendettas until seed 44 held 14 of 66 faction pairs open on day 120, over the M15 gate's sanity fifth
# (6.5: 10/78, 6/55, 11/66; Murders on 42-47 257). Placeholders for the late calibration.
class_mult = { civilian = [0.11, 0.14, 0.008, 1.0], member = [4.05, 6.5, 0.25, 1.0], watch = [2.15, 6.1, 0.04, 1.0] }

