# ---------------------------------------------------------------------------
# Hunger as sickness (docs/HUNGER_SICKNESS.md; plan docs/plans/hunger-sickness.md). Starting values. On with
# the flip (Dylan 2026-10-10); always on since P10 (its `enabled` switch retired).
[sickness]
diet = true                # § 1-2: synth/real, the meters, the debuffs
bins = true                # § 4
cancer = true              # § 3
synth_stretch = 3          # meals per shelf unit cut with filler (a synth meal ~1 coin at P 3-4)
# P2 measured (seed 42 x 60, flipped): at 10 real meals' coins 64 % of meals were synth and 1,059 of ~1,900
# malnourished, the working class included; coordinator call: buy real holding 3 meals' worth.
real_meal_reserve = 3      # buy real at coins >= this many real meals ...
mal_seek_real = 0.5        # ... or when this malnourished with 2 real meals' coins
mal_hungry_edge = 0.25     # an hour below this hunger is a hungry hour
mal_hungry = 0.08          # malnutrition per fully hungry day (~12 days to 1.0)
mal_poor_diet = 0.012      # per day at an all-synth diet (~25 days to the onset)
synth_malnut_cap = 0.45    # ... but a synth diet levels off here (run-down, not sick); hunger and scraps push past it
mal_real = 0.02            # off per real meal (max 2 a day)
mal_onset = 0.3
# After P5 (Dylan): a share cleared a day, so a diet settles. Steady t* = tox_synth x S / tox_clear_frac, S synth
# meals a day. The sim's day of food is ~1 meal (food_satisfy 0.5; measured 0.9-1.0 meals per adult-day), so
# all-synth is S = 1 -> 0.8, and "one synth meal a day" (one of three human meals) is S = 1/3 -> 0.27. Hence
# tox_synth / tox_clear_frac = 0.8; tox_clear_frac 0.03 (a 23-day half-life toward a cleaner diet) -> tox_synth 0.024.
tox_synth = 0.024          # per synth or Mission meal
tox_dive = 0.048           # per bin meal (scraps: twice synth)
tox_clear_frac = 0.03      # the share cleared a day
tox_seed_years = 8.0       # world creation: the seeded level approaches the diet's steady one by 1 - exp(-(age - 16) / this)
tox_seed_jitter = 0.3
tox_onset = 0.4
mal_energy = 0.5
tox_energy = 0.3
cancer_energy = 1.0
mal_work = 0.4
cancer_work = 0.5
sick_mal = 0.3
sick_fire_days = 5         # sick days in the last 14 that cost the job (Dylan)
mal_mood = 0.2
tox_mood = 0.15
cancer_mood = 0.3
frail_old = 2.0
frail_fight = 0.2
fertile_mal_max = 0.5
