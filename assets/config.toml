service_to = 60                # 01:00 (no service 01:00-05:00)
night_from = 1260              # 21:00
night_to = 300                 # 05:00
danger_crime = 3.0             # crime_rate at which an average-courage rider refuses at night
power_per_line_day = 20        # the Treasury -> the World account, per open line: E13's scale (a Market's power is 20 a day). Phase 3: the placeholder 150 sent 450 a day to the World, which then minted ~45k fewer export coins over 120 days (purses -25 %, employed -5 %, seeds 42-47)
dodge_fine = 5                 # a dodger's fine when the Precinct is full
# The El crews' cap (2026-10-12): crews = min(the fares past the power / a sweeper's wage, staff_per_line x open lines).
# Uncapped, the fares paid ~250 crews on seed 42 (12.5 % of residents, ~14 % of jobs: a jobs program masking the
# Treasury's hoard); a real metro staffs 0.2-0.8 % of its population. Per open line, not per stop: the line is the
# unit the power is billed by, and a cut line stands its crews down with its power; per stop would tie the crews to
# stop_spacing, a timetable knob. 4 a line = 12 crews (0.6 %). Seeds 42-47 x 120 vs uncapped: employed 1,746 ->
# 1,396 with the fares parked in the Treasury (145k at d120), 1,503 with [treasury] credit_max returning them.
staff_per_line = 4

