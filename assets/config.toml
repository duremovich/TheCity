[transit]
# docs/TRANSIT.md (the El). On by default since phase 3 (CITYSIM_TRANSIT=0 turns it off for A/B runs).
# City-owned (Dylan 2026-10-10): fares go to the Treasury, which pays the power to the World and the El's
# maintenance crews (Sanitation posts, `TransitState.staff`, capped by staff_per_line) out of them. Placeholders unless a comment says measured.
enabled = true
fare = 1                       # coins per ride, transfers free
headway = 10                   # ticks between departures from each terminus
ride_ticks_per_tile = 0.25     # 4 tiles a minute, ~8x walking
dwell_ticks = 1                # per stop passed
transfer_ticks = 5             # per transfer (half a headway)
stop_spacing = 16              # track tiles between stops
