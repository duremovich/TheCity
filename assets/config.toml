min_ride_tiles = 24            # no ride under this Manhattan distance
min_saving_ticks = 15
ticks_per_coin = 20            # what a coin of fare must save in time
poor_ticks_per_coin = 60       # ... for a wallet under poor_meals meals
poor_meals = 2
dodge_lawfulness = 0.25        # a rider who can't pay jumps the gate below this (a FareEvasion crime)
dodge_always = 0.1             # ... and never pays below this
dodge_deterred_days = 7        # phase 3: arrested in the last 7 days, a rider pays if it can (a d90 gang leader jumped every morning and spent every day in the cells)
