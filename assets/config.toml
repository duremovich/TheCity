# ~9 h) about 17 h of 24, so on the street ~7 h; a homeless agent ~24 h (3.4x the street hours), and it
# contests squats with the gangs on top; 3 is that ratio rounded down (the evidence replaces it: the
# prior is worth `prior_weight` body-days).
vf_street_prior_mult = 3.0
vf_short_sources = true             # 2: a riot's / episode's rates x its live hours / 24
vf_chrome_cap = true                # 3: no implant past the psycho line (gangs, guards, Fighters aside)
vf_rent_meal = true                 # 4: rent from income leaves an agent in arrears a meal (mean_price) first
# 5: an immigrant arrives with a seeded adult's savings for its Home's tier: mean(initial_coins) 25 x
# coins_by_tier (Sump 12 -> keeps 15, Mid 25, Spire 75, homeless 25), crossed in from the World, not a flat
# 15 (three days of Spire rent: nearly every year-3 immigrant on seed 43 was starving within two weeks).
vf_arrival = true
# Hunger as sickness P1 (docs/HUNGER_SICKNESS.md § 6; plan docs/plans/hunger-sickness.md): the Full planner's
# hunger gaps the recalibration diaries found, each reproduced by a person probe that failed on d771073.
# Master switch (off is the d771073 city byte for byte); `CITYSIM_HFIX_OFF=1,3` leaves single items off.
hunger_fixes = true
hf_food_first = true                # 1: starving with a meal in reach: eat before paid leisure, a bed, a dose, a sleep
hf_mission = true                   # 2: Eat's can-obtain gate opens on a stocked Mission in reach
hf_buy_not_steal = true             # 3: a food theft costs steal_can_buy more while a meal is affordable
hf_beg_retry = true                 # 4: a Beg with no giver is a dry hour (as Scavenge's), not a failure
hf_shift_first = true               # 5 (P5f): a worker on shift does not leave for leisure (Unwind 0 on shift)
# P5g (Dylan, 2026-10-10: relocation and the hiring cap; transit is its own milestone). Measured on the all-Full
# flipped city (seed 42): the median commute 84-92 tiles (~3 h each way at ~0.45 tiles a minute), farmers 116;
# relocation moved 8 a day and only those holding 21x the rent.
# Every commute measure goes through life::commute_cost (travel ticks; today the walk: tiles x [exec]
# move_ticks_full; the El will swap its body). 80 ticks = 40 tiles walked.
hf_relocate = true                  # 8: a worker past commute_move_ticks moves near work on the first rent, not 21x
commute_move_ticks = 80
commute_margin_ticks = 40           # 8: ... when the move saves this much
relocate_per_1000 = 20.0            # 8: movers a day per 1,000 residents (40 at 2,000; was a flat 8)
hf_hire_near = true                 # 9: a candidate within commute_hire_ticks is hired before any beyond it
commute_hire_ticks = 80
# P5h (Dylan, 2026-10-10: the city grows toward jobs; map-agnostic): housing demand at an employer is its
# workers past commute_move_ticks; with fewer free beds than housing_demand_min in range for
# housing_demand_days midnights, a Home goes up on the nearest vacant Lot in range (else a floor on a Home
# there), its owner corp paying when it can, else the Treasury (an import, keeping band[0]), else nothing
# that day (no unpaid builds). Relocation then fills it.
hf_grow_housing = true              # 10
# P5i (coordinator call, 2026-10-10): 10.5 % of Full's shift time was Eat, mostly a walk out 2-4 h+ into the
# shift with nothing carried and an empty pantry (92 % of the on-shift Work -> Eat switches).
hf_shift_meals = true               # 11: eat or pack a meal before a shift; grocery runs off shift
grocery_score = 0.5                 # 11: the fed worker's Eat (the grocery run) scores this
grocery_energy_floor = 0.4         # 11: no grocery run that leaves the body under this energy by the time it is home
grocery_ticks_per_meal = 60        # 11: a grocery run brings home a meal per this many ticks of its round trip (0: off)
# P5j (coordinator call): the farmers' on-shift sleep came from short nights (60 % after under 4 h; nights
# ~13 % Unwind, ~16 % walking home to bed). Bedtime = leaving time - a full night - the walk home.
hf_work_night = true                # 12
work_night_sleep_flat = 0.5         # 12: Sleep's flat at bedtime (x the ramp's pressure)
work_night_ramp_ticks = 120         # 12: the pressure rises over the 2 h before bedtime
work_night_unwind_mult = 0.3        # 12: Unwind and the grocery run past bedtime
# Coordinator call (after the recalibration): employed workers slept rough beside empty beds (the deposit wall).
hf_rehouse_employed = true          # 13: with no_safety_net, a worker re-houses on the first rent (the jobless keep the deposit)
housing_demand_min = 6              # 10: one Home's beds
housing_demand_days = 3
housing_builds_per_1000 = 1.0       # 10: Homes or floors a day per 1,000 residents (2 at 2,000)
# The catch-up (2026-10-11: the flipped city's Farms grew to ~1,000 workers and outran two builds a day: 458 far
# workers on day 120, seed 42): a ready employer's unmet demand (far workers less free beds in range) asks
# ceil(unmet / a Home's 6 beds / housing_catchup_days) builds a day, the city's floored at housing_builds_per_1000
# and capped at housing_builds_max_per_1000 per 1,000 residents; a build keeps the demand count (free beds in range
# reset it). Payment as before (no unpaid builds). 0 days: the flat rule.
housing_catchup_days = 5.0
housing_builds_max_per_1000 = 6.0   # 12 a day at 2,000
# The pre-roll (2026-10-11; with items 8-10, wages and no_safety_net on): the seed city has stood for years, so at
# world creation, after the staffing, Homes go up on Lots in range of the far workers' jobs (else floors on Homes
# there), unpaid as the map's own Blocks (no coin moves; no event), relocation filling them, until every employer's far
# workers have beds in range or no Lot or floor is left (flipped seed 42: day-0 far workers 661 -> 98).
housing_preroll = true
hungry_reach_mult = 2.0             # 2: a starving agent walks this much further to a Mission
steal_can_buy = 12.0                # 3
beg_dry_max = 3                     # 4: dry Begs in a row that cool Earn ...
beg_cool_hours = 1                  # ... for this many hours
# Lives at work phase 7 (docs/LIVES_AT_WORK.md § 5.3; placeholders), under the [lives] master
# (CITYSIM_SPIRE_HOMES_OFF=1, or 0 here): a corp exec's Home is of exec_home_tier or better (2: the
# Spire) when one has room: at seed and on promotion (`life::house_exec`), daily for an exec
# housed lower (the same move), and the "nearer work" relocation looks only at Homes of that tier.
# No eviction. The Spire's beds are checked at seed against execs x exec_home_spare (printed).
exec_home_tier = 2
exec_home_spare = 1.5

# ---------------------------------------------------------------------------
# Life pass L2: the living city (docs/LIFE_L2.md; plan ~/.claude/plans/life-l2.md). Every key is a
# placeholder for phase 5's calibration. Kept as new sections at the end of the file (plan "Parallel phases"): the seven
# kinds' buildings are sub-tables below; their wages (`[economy] wage_host` 6, `wage_attendant` 5,
# `wage_cook` 5, `wage_fighter` 7, `wage_croupier` 6, `wage_concierge` 8, `wage_fabber` 7), their
# `[corps] found_cost` (club 400, arcade 200, noodle_bar 120, fight_pit 300, den 250, lounge 900,
# fab 900), `value` (600, 300, 180, 400, 350, 1400, 1500), `upkeep` (10, 4, 2, 4, 4, 20, 15) and the
# plan's flat `residents_per_club` 600, `_arcade` 600, `_noodle` 120, `_pit` 1000, `_den` 800,
# `_lounge` 2000 (L5) are the spec's values as serde defaults in config.rs (set them in their sections
# to override). `[buildings] market.staff` / `bar.staff` stay 4 / 3 (L3: the identity).
[living]
# A corp's order dwell (L2, the M14 ruling of 2026-10-08): corps flipped orders on shock rescores at a
# 0.02 margin (Nutrix Research -> Secure within a day, 0.46 vs 0.44, on every seed of 42-47), so
# Research never lasted [tech] research_build_days (3) and no Lab was built under it. For this many
# days after taking an order a shock rescore needs the challenger to win by corp_order_margin, unless
# the pending shocks reach [life] order_severe; after it shocks rescore as in M11/M14 (ties only). The
# daily rescore keeps [corps] hysteresis (0.10). Placeholders.
corp_order_dwell_days = 3
corp_order_margin = 0.05
# Gang desistance (L2 phase 5, `gang::desist`; the year runs' diagnosis: the roster cap had no exit, four
# gangs filled to [gangs] max_members 60 by ~day 150 and stayed there, 0-18 leaves a month, every death
# refilled). Daily, an ordinary member (not the leader or the two lieutenants; not during a raid or BreakOut
# muster, jailed, cuffed, hunting or hunted) walks away with p = desist_base x the terms below. Placeholders.
# Measured on 42 / 43, 365 days (members on day 365 of 240 cap; population day 365; violent deaths days
# 241-360; leaves a month in year 3): base 0 -> 233 / 238, 1,625 / 1,636, 299 / 266, 8-16; 0.004 -> 238 /
# 240, 1,683 / 1,572, 284 / 283, ~30-50; 0.008 -> 238 / 237, 1,722 / 1,584, 226 / 273, ~70-85; 0.02 -> 184 /
# 198 (75-85 % of the cap, 160-205 through year 2-3), 1,758 / 1,779, 250 / 203, ~110-140; 0.05 -> 134 / 170,
# 1,868 / 1,795, 217 / 238, ~200. Recruitment refills any rate near the 1-3 a week a gang the orchestrator
# asked first, so only a monthly turnover of about half a roster holds the plateau below the cap; 0.03 broke
# seed 42's Treasury in year 3 (0 from day ~270, 138 emigrants in a month), so 0.02.
desist_base = 0.02
desist_employed = 4.0                # x while holding a Job that has paid a wage
desist_unpaid_days = 14              # no gang stipend or tribute for this many days ...
desist_unpaid = 3.0                  # ... x this
desist_settled = 2.0                 # x when married or housed outside the Sump
desist_age = 35                      # from this age (sim years) ...
desist_aged = 2.0                    # ... x this
desist_jailed = 2.0                  # x when released from a sentence in the last 30 days
desist_feud = 0.25                   # x (a brake) with an unsettled grudge on a rival gang or the gang in a vendetta
# x (a brake) for a member the gang invested in or earns through: the keeper of an asset its gang owns (the
# gang's Arms implants and decks), or a deal in the last 7 days (deal_log). Without it the ~250 leavers per 120 days walked the gangs' runners, armed members
# and dealers out: on seed 42 Ledger thefts 5 -> 0, Flatlines 4 -> 0, Detox 1 -> 0, off-screen killings 4 -> 0.
desist_invested = 0.25
desist_cooldown_days = 60            # a leaver's JoinGang cooldown
# The Reserve's release (L2 phase 5, `economy::reserve_release`). Seed 43's year 3: Greenline went bankrupt
# on day 228 and an agent bought its Street Market with no coins left for wholesale, so the daily restock
# sold it nothing; the shelf stood at 0 and price 30 from ~day 285 while the Reserve Depot sat full at 20,000,
# and starvation per year read 12 / 9 / 164 (population 1,498 on day 365). The release sends Reserve food
# free to a Market priced above reserve_release_price (twice price_base) and under restock_floor.
reserve_release_price = 8
reserve_release_batch = 200

