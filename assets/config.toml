# ---------------------------------------------------------------------------
# M16a contracts (docs/M16_CONTRACTS.md; plan ~/.claude/plans/m16a-contracts.md).
# A contract is a record (buyer, kind, target, price, deadline, broker, taker,
# status) matched by a score and resolved by a seeded dice roll between
# fictional agents; escrow is coins held between purses. `enabled = false`
# (`--contracts-off`, and `--l2-off`) is the L2-closing city byte for byte.
# Spec values; keys marked "plan" are placeholders (calibrated late, never in M16a).
# Defaults (code; override here if needed): [buildings] fixer = { capacity = 8,
# stock_cap = 0, staff = 1 }; [economy] wage_fixer = 6; [corps] found_cost.fixer
# 400, value.fixer 500, upkeep.fixer 8; [lod] contract_quota = 24, fixer_quota = 4
# (phase 4); [gangs.order_flat] job = 0.0 (phase 2); [law] interrogate_days = 30,
# interrogate_bias = 0.0, accessory_conf = 0.5, accessory_mult = 0.75,
# heat_per_hit = 0.15, heat_per_named = 0.3, heat_decay = 0.02, warrant_heat = 0.8,
# close_days = 7, bribe_cool = 0.3, fixer_talk = 0.3, accessory_days = 60,
# corrupt_lawfulness = 0.3, corrupt_heat = 0.3 (phase 3).
[contracts]
enabled = true
max_open = 256
closed_keep_days = 30
price_base = { hit = 400, beat = 120, guard = 25, locate = 20 }
deadline_days = { hit = 10, beat = 7, guard = 7, locate = 14 }
risk_w = 1.5
standing_w = 1.0
max_attempts = 2
accept_min = 0.35
contract_flat = 0.0
renege_base = 0.3
renege_grudge = 0.6
hire_gap = -0.1
hire_ratio = 0.7                   # phase 3 (C33)
dirty_lobby = 0.3                  # phase 3 (C33)
law_bounty_days = 3                # phase 3 (C33)
death_squad_lawfulness = 0.2       # phase 3 (C33)
hire_min = 0.3                     # plan C20: the hire pass's Hunt score without the might term

[fixers]
fixer_cut = 0.2
fixer_lawfulness = 0.35
fixer_skill = 0.8
regular_days = 14
gun_skill_min = 0.45
gun_lawfulness = { hit = 0.3, beat = 0.4 }
run_offers_per_day = 1             # phase 3 (C34)
match_hour = 18
offers_per_day = 4
crew_max = 4                       # phase 2 (C25)
fixers_per_pop = 800               # plan C8: open Fixers <= residents / this, for NPC founding
network_flat = -0.1                # plan C13 mode B
hire_reach_tiles = 64              # plan C20: a Fixer within reach of the holder's Home door
