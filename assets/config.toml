# Living City Simulator tuning. Every constant the simulation uses lives here.
# See docs/SPEC.md › Tuning defaults for what to raise or lower and when.

[world]
# M10: the 256 x 192 map (assets/map_v1.txt is the 96 x 64 v1 city; unit tests use Config::v1_profile).
map = "map.txt"
# M10: 2,000 residents (400 Blocks x 5). v1 was 300.
population = 2000
residents_per_home = 5
spouse_p = 0.6
age_min_years = 18.0
age_max_years = 60.0
initial_coins_min = 10
initial_coins_max = 40
initial_food_min = 0
initial_food_max = 2
skill_min = 0.1
skill_max = 0.4
home_pantry_initial = 10
# M10 (2,000 residents): per Market (three of them); v1 600 for one.
market_initial = 1500
# M10: v1 1500. The Reserve Depot holds 20,000.
warehouse_initial = 10000
# M10: v1 5000, scaled for ~6.7x the payroll and dole.
treasury_initial = 35000
price_initial = 3
# M11 (VISION "Brutality, enhancement and status": a deeply unequal city from day one): the initial
# coin draw is multiplied by the Home's tier, Sump / Mid / Spire. v1_profile keeps [1, 1, 1].
coins_by_tier = [0.5, 1.0, 3.0]
# tick_of_day ranges [start, end): Work phase 6 days in 7; guards with an even index work nights.
shift_day = [[540, 1080]]
shift_night = [[1260, 1440], [0, 360]]

# M10 (2,000 residents): v1 24 / 10 / 3 / 2 / 1. Four clerks per Market, eight bartenders over three
# Bars, 16 farmers per Vat Farm; the rest draw the dole.
[world.jobs]
farmer = 160
guard = 36
clerk = 12
bartender = 8
gravedigger = 4

[world.needs_initial]
hunger = 0.8
energy = 0.9
safety = 0.8
belonging = 0.6
intimacy = 0.5

# Capacity = max agents inside at once; stock_cap = food units the building can hold.
[buildings]
# Jobs & lives phase 1 (D4): each kind's row is its `KindCfg`: capacity, stock_cap, staff, and the optional
# columns niche (the corp niche it sits in; was corp_brain::niche_kinds), foundable (an agent founds it: the
# tie-break rank, 1 first; was founding::FOUNDABLE), found_cost / value / floors_seed / floors_max (the new
# kinds). An absent column keeps the kind's built-in value, so these rows restate M11-M17's table exactly.
home = { capacity = 6, stock_cap = 30, niche = "Housing", foundable = 2 }
# M10: farm 16 (160 farmers / 12 farms; v1 12), jail 80 (v1 16; 160 since 2026-10-06), hideout 30 (60 members; v1 12),
# warehouse stock_cap 20,000 (v1 3000). Lots and Security Offices are inert until M11.
# M11 D17: staff = full staff of an owned niche building (Grow tops vacancies up to it; an
# agent-owned Bar below it posts a bartender vacancy daily).
farm = { capacity = 16, stock_cap = 400, staff = 14, niche = "Food" }
market = { capacity = 20, stock_cap = 2000, staff = 4, niche = "Food" }
bar = { capacity = 24, stock_cap = 0, staff = 3, niche = "Food", foundable = 1 }
jail = { capacity = 160, stock_cap = 0 }  # 2026-10-06: 80 -> 160 (pinned at its cap from ~day 28 since M12 p5; 160 beds read -28 % violence)
cemetery = { capacity = 8, stock_cap = 0 }
hall = { capacity = 20, stock_cap = 0 }
hideout = { capacity = 30, stock_cap = 200 }
warehouse = { capacity = 6, stock_cap = 20000 }
security_office = { capacity = 12, stock_cap = 0, niche = "Security" }
lot = { capacity = 0, stock_cap = 0 }
hotel = { capacity = 12, stock_cap = 0, foundable = 3 }       # M12 D20: beds ([street] hotel_beds caps a built one)
clinic = { capacity = 6, stock_cap = 200, staff = 2, niche = "Tech", foundable = 4 }    # M13 D16: the Ripperdoc (inert in phase 1)
garage = { capacity = 8, stock_cap = 400, staff = 3, niche = "Tech", foundable = 5 }    # M13 D16 (inert in phase 1)
lab = { capacity = 8, stock_cap = 0, staff = 4 }         # M14 V16: four Researchers make Data
# M15 W36 (phase 4): staff 3 -> 1. A seeded corp Feed earns ~3/day of ads (few corps clear the cash bar);
# at three Reporters and upkeep 10 Nutrix Now lost ~1,400 a run and Nutrix went bankrupt late on 3 of 42-47.
feed = { capacity = 6, stock_cap = 0, staff = 1, foundable = 6 }

[needs]
hunger_decay_per_tick = 0.000347
# 0.000926 (18 h awake) on paper; with an 8 h sleep that is a 26 h cycle and workers nod off mid-shift.
# 0.000694 (24 h) locks sleep to the night.
energy_decay_per_tick = 0.000694
safety_recover_per_tick = 0.0010
belonging_decay_per_tick = 0.000139
intimacy_decay_per_tick = 0.0000694
# 7 on paper; at 7 a typical starting wallet (10-40 coins at price 3) reads as secure, half the
# workforce idles until the Market empties, and farmers abandon shifts for snacks. 30 gives Work the
# U(wealth) the spec's worked example assumes (~0.87) for a wallet of a few days' wages.
wealth_days_secure = 30.0
food_satisfy = 0.5
sleep_ticks_full = 480
chat_belonging = 0.3
starvation_grace_ticks = 4320
fun_decay_per_tick = 0.00023         # L2 § 2: ~3 days full to empty at sociability 0.5
fun_mood = 0.3
fun_satisfied = 0.6

[economy]
# L1b (the pressure calibration, Dylan 2026-10-07): 3.0 -> 4.0. Once L1 paid wages and the dole in place
# and stopped the walks, food at 3 against a dole of 4 left nobody hungry and need-driven crime fell to
# a quarter (seeds 42-44, scavenge_p 0.15 in both rows): price_base 3.0 thefts 1.9-3.0k, riots 0, Dregs in
# band 27-32 of 120 days, litter in band 0-19 of 106; 4.0 thefts 9.2-14.6k (ab79188 7.9-9.0k), riots
# 4-6, Dregs in band 118-120 days, litter 58-74 of 106, Farm trucks and Data sales back (the Food corps
# earn again), starvation 10-15, ticks/s 5.3-6.1k. The dole cut instead (4 -> 3, price 3.0) starved
# the corps: truck share 0.21-0.31, Virt nodes 24-27, Data sold 0-100. At 4.5 thefts 27-30k, ticks/s
# 4.3-4.7k.
price_base = 4.0
# The spec's 600 assumed a 600-unit Market; with farm_yield_base 2.4 the shelf sits at ~1500-1900,
# so at 600 the price was pinned at 2 all year, the Treasury could not cover wages plus dole, and the
# first price signal of a Winter famine was the 2 -> 28 cliff on the day the shelf hit zero.
# 1500 puts the price at 3 in normal times and lets it climb through 4, 6, 9 as Winter draws it down.
price_ref_stock = 1500.0
price_min_stock = 7
price_cap = 30
wage_farmer = 6
wage_guard = 8
wage_clerk = 6
wage_bartender = 5
wage_gravedigger = 5
wage_sanitation = 5                # M12 D23: a city sweeper
wage_ripperdoc = 8                 # M13 D16
wage_mechanic = 7                  # M13 D16
# M14 V16/V47 (phase 1 calibration, last of the four knobs): 9 -> 4. A Lab earns nothing until
# phase 2's Data market, and Militech lives at break-even (M13 seed 42: 233 on day 60, 0 by day 90):
# at 9 (36 a day a Lab) it went bankrupt on day 31, at 6 on day 59; at 4 the tech corps' day-60
# treasuries clear half of M13's on seeds 42-45 and the seeded bankruptcies move by seed noise.
wage_researcher = 4
# M15 W36 (phase 4): 8 -> 4 (the Researcher's wage). At 8 Nutrix Now cost Nutrix ~34/day against ~10 of
# ads: Nutrix ran ~1,400 below the word-off city by day 42 and lost its Secure/Research tie and early trucks.
wage_reporter = 4
# 1.4 on paper assumes 24 farmers x 9 h at farming 0.5 and one meal per citizen. In practice farms
# work 6 days in 7, farmers attend ~75% of a shift (meals, wage trips), initial farming skill is
# U(0.1, 0.4) (x0.8) and citizens eat ~1.2 meals a day, so ~380 food/day is needed. 2.4 keeps the
# Market stocked but not flooded (2.8 left nobody ever broke, so no crime; the spec's 1.25 starves
# the town by day 14); Summer (x1.4) fills the stores and Winter (x0.3) is still a famine by design.
farm_yield_base = 2.4
farm_skill_floor = 0.6
farm_skill_slope = 0.8
season_mult = [1.0, 1.4, 1.1, 0.8]
energy_decay_mult = [1.0, 1.0, 1.0, 1.15]
spoilage_pantry = 0.05
spoilage_market = 0.01
haul_batch = 50
haul_min_stock = 10
# Deviation from the spec (which has no automatic Warehouse -> Market transfer): without it the
# Summer surplus overflows a full Warehouse and is lost, then ~2000 units rot in it while the
# Market stands empty for the last ten days of Winter. The floor is well under price_ref_stock, so
# Winter still pushes the price to ~6-7; the player's Release reserve lever remains the only way
# to flood the shelf and bring the price back down. 0 restores the spec behaviour.
# M10: per Market now (three of them, 2,000 residents); v1 400 / 200 for one Market and 300.
# 1200 / 1200, not the plan's 900 / 450: every Vat Farm's nearest Market is the Civic one (the
# farms tie on door distance and the lower index wins), so the two Mid Markets are fed by restock
# alone. At 450 a day they were empty from day 3, the Reserve sat full at 20,000, and by day 9
# eighty hungry thieves filled the Jail. A floor of 1200 carries a Market's daily demand and still
# prices at 3; Winter drains the Reserve and the price climbs as before.
restock_floor = 1200
restock_batch = 1200
build_home_cost = 200
# M11 D27: an exec's daily draw from their corp.
wage_exec = 10
# M11 phase 5: a corp's Food level keeps its tenths (Undercut 0.9 x 3 = 2.7, each shopper pays 2 or 3
# from a hash, no RNG draw; identical at level 1.0). Rounded to whole coins, Undercut and a 1.15
# Squeeze never moved a price and so never moved a customer (diagnosis: Nutrix Squeeze to 4.5 took its
# daily sales 760 -> 157 once the fraction was kept). Fines, the fence and the UI read the rounded price.
price_tenths = true

[crime]
steal_base_cost = 8.0
steal_lawfulness_factor = 20.0
steal_guard_penalty = 6.0
steal_starving_bonus = 4.0
steal_dark_bonus = 3.0
beg_base_cost = 5.0
beg_pride_factor = 10.0
forage_base_cost = 6.0
witness_base = 0.6
witness_stealth_factor = 0.5
witness_guard_bonus = 0.3
sight = 6
sight_day_crime = 8
sight_night_crime = 4
sentence_days = [3, 6, 10, 30]
# M13 D47: the crimes appended after Vagrancy (GrandTheft and Manslaughter land in phase 2).
sentence_days_ext = { grand_theft = 6, dealing = 5, abduction = 20, manslaughter = 10, intrusion = 2, data_theft = 5, fraud = 2, blackmail = 3, arms_dealing = 6, smuggling = 8 }   # M14 V18: intrusion, data_theft; M16b: fraud, blackmail; Jobs & lives phase 3: arms_dealing, smuggling (UnlicensedArms is a night in the cells)
# jail capacity is buildings.jail.capacity
fight_death_p = 0.03
stat_theft_caught_p = 0.25
warrant_expiry_days = 30
suspect_seen_ticks = 240
patrol_legs_per_shift = 5
fine_mult = 2
# M12 review: guards answering an alarm at a door (a corp raid, a riot; the posted private guards
# too) come only from within answer_radius tiles of it (Chebyshev); the brawl stands them at the
# door. Off-shift guards answer (a Secure corp's call-in) only when awake: before, Secure dragged
# them out of bed from anywhere on the map. Seeds 42-44, corp raids lost / district Crackdown days
# / riots: HEAD 10 of 18 / 13 % / 1,2,4; radius 24: 1 of 14 / 29 % / 5,2,4; 48: 3 of 14 / 46 % /
# 4,4,5 (the M12 gate's gang-landlord bullet fails, 6 of 8); 64: 4 of 16 / 42 % / 4,4,5; 80: 12 of
# 23 / 30 % / 1,3,5; 96: 9 of 17 / 21 % / 1,3,3; 160: 13 of 20 / 15 % / 2,3,5. Without the night
# call-in a won corp raid feeds the gang and the law's Crackdowns; 96 keeps the M12 bands.
answer_radius = 96

[social]
edge_create_ticks = 30
affinity_per_hour = 0.05
friend_threshold = 0.4
rival_threshold = -0.3
enemy_threshold = -0.6
propose_affinity = 0.6
propose_trust = 0.5
gang_stipend = 4
extort_amount = 5
join_gang_affinity = 0.4
join_gang_desperation_hunger = 0.2
join_gang_desperation_lawfulness = 0.3

[gangs]
# One gang per Hideout in map order: The Hollow holds the south-west corner, Ninefold the south-east.
names = ["The Hollow", "Ninefold"]
treasury_initial = [50, 50]
order_weight = 0.35
freelance_loyalty = 0.3
# v1 recruited on promise up to 3 and then asked the treasury to fund the whole roster. A gang of
# 3-5 sits at the stipend's break-even, so that left the loser of the first raid stuck for good and
# made growth hostage to a windfall. The promise now covers the first 5 for good; the treasury
# funds each member beyond them.
# M10: 15 (was 5). At 2,000 residents both gangs stalled at 5-6 members all year (the stipend
# break-even), never touched each other's turf across the Sump and the M8 gate saw no flip or
# cross-gang fight; 15 lets them reach ~16 each. (10 was path-dependent and stalled at ~10.)
recruit_on_promise = 15
# Members are never Statistical now, so every one of them extorts daily and the revenge fights
# scale with headcount: an uncapped gang reached 29 and 7 Assaults/day (the M7 baseline is 3).
# M10: 60 (v1 20) for 2,000 residents; still two gangs.
max_members = 60
# 4: with 7, a burst of arrests kept a gang lying low for weeks (and lying low earns nothing).
heat_days = 4
hysteresis = 0.10
contest_min_ratio = 0.8
raid_min_ratio = 1.2
# Gang treasuries run at 0-30 (the stipend eats the tribute); 40 meant no raid was ever worth it.
# At 10 a strong gang raids a few times a season; the cooldown caps the pace.
raid_min_prize = 10
# 30: Retaliate obeys the cooldown too, and at 10 every sack bred a counter-sack five days later
# (17 raids on seed 42 against the spec's 2-6). A raid a season per gang.
raid_cooldown_days = 30
raid_prize_frac = 0.5
raid_muster_hour = 22
# M10: 8 (was 3). On the 256 x 192 map a member can be 6 h from the Hideout, so with 3 h the muster
# left without them and raiders reached the door one at a time.
raid_gather_hours = 8
raid_gather_radius = 6
retaliate_days = 3
sacked_days = 3
# 0.5: one arrest (0.3) alone no longer forces a rethink; two in a day, or any death, does.
shock_severity_rethink = 0.5
# M9: this many members (at most half the gang, newest first, rotating daily) sleep at the Hideout
# each night, so a raid meets defenders. In M8 every raid found the Hideout empty and sacked it.
# 4 (was 2): after phases 2-4 changed who is jailed or mustering, 2 left every seed-42 raid a sack (0 of 5 met a defender); 4 meets 3 of 5.
night_watch = 4
# M9 breakouts (docs/M9_LAW.md): a cooldown of their own, the fit headcount needed to try, and how
# many convicts one breach frees. The boss sitting inside doubles the pull (a consideration, not a flat).
breakout_cooldown_days = 15
breakout_min_members = 2
breakout_max_freed = 3
# M12 phase 4 (docs/M12_DISTRICTS.md § 5, plan D36-D40).
# Phase 4 calibration: 48 -> 180, the farthest muster a Coarse march (2 ticks a tile) can leave and
# still reach the door inside the 6-hour march window (6 x 60 / 2). Gangs rarely hold a Home within 48
# of a rival Hideout or a corp prize, so the march started at a corner Hideout 200-230 tiles off and
# arrived after the window. Raids with >= 3 at the door, seeds 42 / 43 / 44 (with raid_min_members):
# 48 -> 50 / 33 / 42 % (without it), 180 -> 78 / 94 / 79 %.
muster_near_tiles = 180
empty_claims_days = 3              # an empty gang loses its claims after this many days
reform_days = 14                   # an emptied gang re-forms no sooner ...
leader_min_days = 7                # Shadow V4 bug 8: a member this many days in outranks a newer one for the lead (a clinic owner led the Choir 3 days after joining)
reform_max_coverage = 1.2          # ... and only while its Hideout's district coverage is below this
split_strength_ratio = 0.8
split_loyalty = 0.66               # M12 phase 5: 0.6 -> 0.66 (mean gang loyalty sits at 0.61-0.71 at a decapitation; at 0.6 seeds 42-44 never split with the phase 5 stat table)
split_base = 0.5
max_gangs = 4
splinter_names = ["Rust Saints", "Low Choir", "Gutter Kings"]
corp_raid_frac = 0.05
corp_raid_cap = 500
# M12 fix pass (corp raids were won 19 of 19 on seeds 42-44 and took whole Market stocks, 1,940
# food, price 12 for four days). A won raid takes corp_raid_loot_frac of the building's food (the
# coins stay corp_raid_frac of the treasury, capped at corp_raid_cap). The defence: up to
# corp_raid_posted of the owner's or contractor's private guards on shift (any shift while the owner
# holds Secure) are posted at the door, the district beat's on-shift guards answer (the Precinct's
# watch in its own district too), and a crew breaks once corp_raid_break of it has lost a
# pairing. Seeds 42-44: lost 1 / 1 / 2 of 4 / 6 / 6, 25 % (posted 3 with no break: 1 in 14 lost;
# a 0.34 break: 14 of 20 lost; 0.5 lets big crews win); the raided Market's price never passed 8.
corp_raid_loot_frac = 0.25
corp_raid_posted = 5
corp_raid_break = 0.5
# Phase 4 (plan addition): Raid and Retaliate need 3 fit members. Early gangs of 4-10 and fresh
# splinters raided with 1-2 at the door (seed 43: 9 of 17 expeditions); a raid is a crew's job.
raid_min_members = 3
hole_up_max_tiles = 60             # Shadow V4 bug 11: no Hideout bed further than this from the member (a 901-min walk at 20k)
# L2 (plan L23): the Statistical GangWork day's priors per member-day (placeholders), shrunk toward
# the ledger's on-screen acts with stat_prior_days member-days of weight.
stat_extort_prior = 0.02
stat_claim_prior = 0.02
stat_deal_prior = 0.01
stat_prior_days = 30.0
# Lives at work phase 6 (docs/LIVES_AT_WORK.md § 4.5): leaders lead, read by systems/careers.rs and gang.rs, under
# [lives] enabled (`CITYSIM_LIEUTENANTS_OFF=1`: every key below 0 and unwritten). Placeholders.
lieutenants = true
lieutenant_per = 8                 # rank 1 to the top 1 + members / this after the leader (leader_scores)
delegate_min_fit = 5               # with this many fit members the leader neither marches nor shakes down (Expand, Squat,
                                   # Harvest, VirtRaid, the raids); he keeps Lead (collect, call), parleys and defends
leader_cut = 0.2                   # the payout's pool: this to the leader off the top ...
lieutenant_cut = 0.1               # ... and this shared by the lieutenants, before the equal shares
raid_w = 0.05                      # leader_scores + raids won as the raid's leader x this (the ladder)

# Flat terms on each order's score (product of considerations + flat). Retaliate's 0.6 lets a
# grudge beat Expand for any leader with greed < 1; LieLow's 0.15 keeps it always available;
# Contest's 0.1 lets the stronger gang turn on the border once its own side is claimed; Raid's
# 0.3 makes a 3:2 edge over a rival with a few coins worth the march (the cooldown paces it).
[gangs.order_flat]
expand = 0.05
contest = 0.1
raid = 0.3
retaliate = 0.6
lielow = 0.15
breakout = 0.28 # was 0.2: after the M9 review fixes (jail duty by rank, Hideout sleep, night watch) 0.2 produced no breakout on seed 42
squat = 0.05    # M12 D38: take a derelict Block in the gang's districts (phase 3 ran 0.0; phase 4 sets the spec's 0.05)
harvest = 0.0   # M13 D36: abduct the city's visible chrome for parts
# M14 V30 (phase 3): 0.0 -> 0.45. U(EV / hoard_heat) reads ~0.05 for a ~225-coin take at hoard_heat
# 5,000, so the product is ~0.03 and the order is its flat: at 0.2-0.3 no gang took VirtRaid in 120 days
# (the standing orders score 0.4-1.1); at 0.45 seed 42's gangs hold it on ~50 days, at 0.55 Murders hit 219.
virt_raid = 0.45
# M14 review: VirtRaid's flat rises by this while a hack grudge's wipe (the store of the gang or
# corp a trace named) is in the best runner's reach; the order then sends that wipe first.
virt_grudge = 0.2

# M9: the law as a faction (docs/M9_LAW.md). A captain (the most lawful guard) scores Patrol,
# Crackdown (on the most-reported gang: patrol loops through its turf, one guard in three holds the
# Jail) and Garrison (every guard holds the Jail) daily and on shocks.
[law]
window_days = 7
crackdown_reports = 6
# M11 review (pending item 33): crackdown_reports is an absolute count tuned for the v1 city's 300; at
# 2,000 the most-reported gang reaches 6 reports in a week on nearly every day, so pressure saturated and
# the law sat in Crackdown on 72 % of days (M9 band 20-60 %). Full pressure now scales with the living
# residents, 18 per 1,000 (~36 at 2,000). Crackdown share over 120 days, seeds 42/43/44: absolute 6
# 72/41/38 %; 20 per 1,000 29/18/10 %; 18 25/38/23 %; 16 31/33/22 %; 15 31/33/14 %; 12 45/33/40 %; 10
# 58/27/38 %. Every key in 8-16 dropped a seed-level gate on its edge (the M11 eviction -> GangJoin
# spiral at 1 of 3, the v1 run's one starvation death, the day-60 monopoly check); 18 clears them with
# margin (spiral 8, 4 deaths). 0 keeps the absolute key; v1_profile sets 0 (300 residents keep 6).
crackdown_reports_per_1000 = 18
garrison_days = 7
hysteresis = 0.10
shock_severity_rethink = 0.5
min_guards = 2
incorruptible = 0.8
bribe_base = 10
bribe_per_guard = 1
bribe_days = 10
bribe_threshold = 0.35
target_margin = 2
# M10: a patrol loop's two Homes come from this many nearest its Market (one of three, drawn per
# loop). 60 is the whole v1 city; on the 256 x 192 map a loop over all 400 Homes could not be walked
# in a shift, so guards on patrol were never credited a shift and starved on full pay.
patrol_beat_homes = 60
# M10: a guard chases only warrants last seen within this many tiles (v1: no limit). On the 256 x 192
# map, with a warrant always open somewhere among 2,000 residents, every guard spent a fifth of the
# day walking across the city after the nearest one, was never credited a shift, and starved.
pursuit_radius = 64
# M10 phase 5c: a guard is owed a shift on law duty (Patrol, Arrest, Work on a Jail day) for at least
# this share of it, or completed (five legs, a held Jail), judged by the clock when the shift ends.
# Owing the day only to a PatrolLeg at the end or an arrest left 412 of 584 shifts unpaid; owing it
# for the goal held at the last tick still left most shifts spent 60-100 % on duty unpaid.
shift_duty_share = 0.5
# M12 phase 2 (docs/M12_DISTRICTS.md § 2, plan D9-D15): the captain deals the patrol guards (those not
# on Jail duty) to districts daily by weight, scores a stance per inhabited district, and a nightly
# 03:00 pass sweeps rough sleepers for Vagrancy. district_beats = false (older configs, v1_profile)
# keeps the M11 routes with none of it.
district_beats = true
alloc_base = 1.0
alloc_crime = 1.5                # M12 phase 5: 1.0 -> 1.5 with alloc_crime_exp, the worst district >= 2x the best's guards on >= 60 % of days
alloc_crime_exp = 2.0            # M12 phase 5: the crime ratio squared (linear gave 40/120 days on seed 42)
alloc_paid = 0.5
alloc_gang_landlord = 1.5
alloc_riot = 3.0
gang_landlord_homes = 20
max_crackdowns = 2
sweep_full = 10                    # rough sleepers that read as full Sweep pressure
private_fill_coverage = 0.7
private_fill_weight = 0.5
vagrancy_base = 0.25               # per rough night at coverage 1.0; M12 phase 5: 0.04 -> 0.25 (the street rungs leave ~2 rough sleepers a night: 0-3 Vagrancy a run at 0.04)
sweep_mult = 3.0
curfew_mult = 2.0
vagrancy_fine = 3
vagrancy_sentence_ticks = 600      # one night
# Lives at work phase 7 (docs/LIVES_AT_WORK.md § 5.2; placeholders), under the [lives] master
# (CITYSIM_STATIONS_OFF=1): a Station (a desk and a few cells, the city's) on a Lot of each district
# whose door is station_min_tiles (Manhattan) or more from the Precinct's door and from every
# Station already placed (farthest districts first; the 2k map: 0-1, the 20k island: printed at
# seed). A city guard is posted to the post nearest his Home among the Stations under their share
# (guard_count x residents nearest them / residents) and the Precinct; station_desk_share of a
# Station's guards hold its desk a shift, the rest patrol its districts first. The escort books at
# the nearest of the Precinct and the Stations with a free cell (station_cells); at transfer_hour
# (ticks of the day: 240 = 04:00) the van takes every held body whose sentence runs past the next
# van to the Precinct, bodiless. A fine or a night's sentence is served at the Station.
stations = true
station_min_tiles = 240
station_cells = 6
transfer_hour = 240
station_desk_share = 0.25

[law.stance_flat]
patrol = 0.2
crackdown = 0.0
sweep = 0.0

# Patrol's 0.2 keeps it the resting posture; Crackdown earns its place from pressure alone (+0.3
# while a refused bribe hardens it); Garrison's 0.05 (+0.5 for a week after a jailbreak).
[law.posture_flat]
patrol = 0.2
crackdown = 0.0
garrison = 0.05

[demography]
birth_p_per_day = 0.004
old_age_days = 10800
old_age_p_per_day = 0.01
emigrate_mood = -0.8
emigrate_days = 7
# Jobs and room P6 (docs/JOBS_V2.md § 4, plan J19-J21; placeholders): read only with [economy2] wages on.
# Harris-Todaro: E = gross_mean x employed / free adults (7-day means); pull = clamp((E - outside_wage) /
# outside_wage, 0, pull_cap); beds = clamp(empty Block beds / beds_ref, 0.25, 1); a week brings
# round(migrants_max x pull / pull_cap x beds x immigration_factor). On top, each vacancy open
# offer_days draws one recruited migrant who arrives holding it (at most offers_max a week).
outside_wage = 3.5
pull_cap = 1.0
migrants_max = 20
beds_ref = 60.0
offer_days = 3
offers_max = 6
migrant_age = [18.0, 45.0]          # years, [lo, hi)
offer_skill = 0.4                    # an offer's role skill is at least this
p_spouse = 0.2                       # a migrant brings a spouse into the same Block
migrant_children = 0                 # children a migrant couple may bring (0: spouse only; Dylan's open question)

[brain]
memory_cap = 24
memory_half_life_days = 7.0
goal_hysteresis = 0.10
# Raising this to stop Bar retries costs whole shifts: two failed wage trips at a full Hall cooled
# Work for the morning. The planner now refuses a visibly full Bar instead.
goal_cooldown_ticks = 120
think_interval_ticks = 30
plan_budget_per_tick = 12
plan_max_expansions = 200
plan_max_len = 6
plan_timeout_ticks = 900
plan_expansion_budget_per_tick = 600
plan_age_promote_ticks = 45         # Shadow V4 bug 20: a plan request this old goes first (at 20k low-urgency goals starved 1-6 h, re-queued after each stale drop)
path_budget_per_tick = 20
mood_w_need = 0.7
mood_w_memory = 0.3

[exec]
move_ticks_full = 2
interrupt_check_ticks = 30
door_capacity_per_tick = 2
door_queue_max_ticks = 30
# Workplace room (2026-10-11): an agent refused at a full building passes it over in `World::local` for this many
# ticks (its replan goes to another Market or the home pantry, not back to the same door; 0: off), and a
# building's own staff are let in when it is full (the staff door: customers never lock the shift out).
refused_ticks = 120
staff_door = true
reservation_ttl = 120
# M10: 16000 (v1 4000) for the 256 x 192 map; street targets can be 300+ tiles away.
astar_max_expansions = 16000
# M10: lazy flow fields kept in an LRU of this many (49 KB each); every real destination fits.
flow_field_cache = 512
# Scale S3a (docs/SCALE_20K.md): the fields' byte budget, MiB (caps the count above by the map's size).
flow_field_budget_mb = 64
# Scale S3a: past this many tiles a Full walk follows an exact A* path (exec::bigpath) instead of a flow
# field. 131,072 = 64 MiB / 512: below it the 512-field LRU fits the budget and nothing changes (the 2k
# map is 49,152). Measured on a street grid with a river: a field builds in 0.3 ms at 256 x 192, 10 ms at
# 1,000 x 1,000, 78 ms at 3,000 x 1,875 (5.5 MB); an A* query 5-120 us p50, 0.4-3.9 ms p99.
flow_field_max_tiles = 131072

[lod]
max_full = 50
# M10: 150 (v1 100). Guards now get gang members' priority; without the room 120 gang members take
# every slot and the whole watch is Statistical.
max_coarse = 150
# M10: days of per-adult Trace kept (the binder and the biography read it).
trace_days = 120
# M10 D26: multiplies the table's p_robbed / p_assaulted / p_killed at use; the knob if off-screen
# violence falls short of the M10 scenario. The parity test pins it to 1.0.
stat_violence_mult = 1.0
# M13 D46: a kitted Statistical agent's p_robbed x (1 + flash_w x Kit.flash); D37: the binder's
# Assaulted/Killed candidate weight x (1 + chrome_bind_w x Kit.fighting).
flash_w = 0.5
chrome_bind_w = 1.0
# L2 phase 3 (docs/LIFE_L2.md § 4, plan L21-L23, L29-L30): the LOD budget and the churn. Sentenced,
# unpinned agents are held Statistical in the Jail (a daily cell pass); each forced class has a quota
# inside max_coarse; the watch ranks only on shift; scavenge's dry hour is Done; beds are reserved.
held_prisoners = true
gang_quota = 25                     # class-2 bodies per gang: leader, two lieutenants, story, front line, rotation
private_quota = 12                  # private guards keeping class 2, by id
raid_quota = 40                     # a gang's class-2 bodies from raid_promote_hours before its muster to the raid's end
raid_promote_hours = 4
front_tiles = 30                    # members this close to the order's target rank in the front line
release_soon_hours = 2              # a prisoner this close to release holds a body (the walk out is real)
# The spec's watch rule (off-shift guards and gravediggers rank as civilians) is off: measured on
# seeds 42-44 (120 days, against 7f392db) it raised Murders 137 -> 216 (+58 %) and broke the M15
# gate's Murders bound (192.5); with it off (M10 D20 kept) Murders 160 and violent deaths 485 vs
# 446 base, while the Coarse budget still holds (the watch is ~50 of the 200 ranked bodies).
watch_on_shift_only = false
# Scale S1: a Statistical worker's hour of co-work ties it to its crew, the coworker_crew co-workers of its
# role nearest it in id order (half each side), not to every co-worker (pairs grow with the square of a
# workplace's staff: ~300 farmers a Farm at 20,000). 0 = every co-worker (the 2,000 city, byte-identical).
# 32 at 2,000 (seeds 42-47 x 120 days): Friend edges -43 %; the 20,000 probe needs it for its tps.
coworker_crew = 0

# M10 holes and the binder (docs/M10_SCALE.md § 3). Weight per candidate:
# (1 - lawfulness)^lawfulness_power x (1 + gang_claim_mult*gang*claims) x (1 + enemy_mult*enemy) x (1 + statistical_mult*stat),
# x other_zone_weight off-zone. p_unknown is drawn first ("nobody ever learns who", D11).
[bind]
hole_ttl_days = 30
max_open_per_agent = 8
p_unknown = 0.30
p_witness = 0.25
coverage_min = 0.5
coverage_max = 2.0
gang_claim_mult = 2.0
# M10 phase 5c, tuned by the parity test's actor shares (spec § 3): v2 1.0 (was 3.0). Full crime per
# head is flat across lawfulness (thefts .24/.52/.25 by bucket against a population of .22/.57/.21;
# assaults and robberies are revenge-, gang- and hunger-driven), so the old weights pinned bound
# crime on the lawless: law0 .34 against Full's .23, law2 .16 against .26. At power 0, enemy_mult 3
# still leaves law2 at .205 (tolerance .05); 1.0 keeps a revenge tilt and passes (.214).
enemy_mult = 1.0
statistical_mult = 0.5
other_zone_weight = 0.25
# M12 D3: a candidate in the hole's zone but another district weighs this (the hole's own district 1,
# another zone other_zone_weight); district_coverage: the witness roll reads the district's coverage
# and the witness pool is the hole's district.
same_zone_weight = 0.5
district_coverage = true
# M10 phase 5c: 0.0 (spec default 2.0; serde default 2.0 for older saves). See enemy_mult: in Full,
# lawfulness does not predict who robs or beats someone, so the binder does not weigh it either.
lawfulness_power = 0.0

# M11 rent (docs/M11_OWNERSHIP.md § 4; plan D6/D7). Rent is per Home per day by tier
# (0 Sump, 1 Mid, 2 Spire), split equally among the Home's adult residents. The city's own Blocks
# charge levers.city_rent (initially this base); a corp's charge base x its Housing price level.
[rent]
# M11 phase 2: [0, 1, 2], not the spec's [1, 2, 4]. Seed 42, 2,000, 60 days each (M10-off control:
# 2,897 thefts, 33 gang members, 8,823 ticks/s): [1, 2, 4] 8,209 thefts, 87 members, 7,037 ticks/s;
# [1, 1, 1] 5,573 / 88 / 7,381; [0, 1, 2] 3,861 / 38 / 7,778. With the dole at 3 and food at 3 the
# dole is exactly a meal, so any coin of rent from the 80 % on it is a meal skipped, hungry adults
# steal and join gangs, and the bodies that buys sank throughput under the 8,000 gate. A Sump Block
# is rent-free (a Dreg on the dole can afford tier 0); the dole at 4 with [1, 2, 4] also held theft
# at 2,808 but cost the Treasury 500 a day. Phase 3 note: Squeeze cannot raise a 0 base.
# M11 phase 5: back to the spec's [1, 2, 4] now that the dole has a coin of slack ([levers] dole 4):
# rent no longer comes out of the one meal the dole bought, Squeeze can raise a Sump rent, and the
# landlords are solvent against upkeep.home [0, 1, 2] (diagnosis: evictions 6-18 per 120 days).
base = [1, 2, 4]
evict_days = 7
# M11 phase 5: 3 -> 7, a week's rent up front. At 3 an evictee on the dole had the 3 coins for a Sump
# Block the next day, so the street lasted exactly the re-housing wait (Dregs 0-5 a day on seeds 42-44).
# M12 phase 3: 7 -> 21, three weeks up front (21 coins for a Sump Block). Blocks hold 6, not the
# spec's 5, and ~1.5 violent deaths a day free a bed, so supply never binds: at 7 the seeded homeless
# and every evictee were housed the day their wait ended and the Dreg share fell to 0.1-0.3 % by day
# 30 (8 or 16 derelicts alike). At 21 a Dreg on the dole, paying for Hotel nights, saves for weeks:
# seed 42 2.06 % mean, 1.56-3.95 %, 120 of 120 days in 1-5 % (seed 43 2.00 %, 120/120); thefts per
# 100 agent-days 3.16 (M11 config 2.84, x1.11), assaults 16.6/day.
rehouse_coins_mult = 21
refuse_days = 30
sump_spoilage_mult = 1.5 # tier-0 pantries spoil this much faster
# M11 phase 5: an evictee sleeps rough this many days before any owner takes them in. Re-housing was
# the same night, so no Dreg ever existed and Dreg emigration and Dreg unrest never ran; the street is
# a rung of the ladder (the survival loop), not a formality.
# M12 D28: 3 -> 7 (spec § 4), and it now also runs for anyone put on the street without an eviction
# (a derelict's residents, the seeded homeless).
rehouse_wait_days = 7
# M11 phase 2 (seed 42, 2,000): with rent taken only from what is left at midnight, the 89 % on the
# 3-coin dole (price 3) reach midnight with 0 coins once their opening savings are gone (mean 12 at
# day 4, 2 at day 24): 600 adults were short every night and 118 were evicted on day 25 alone, against
# a target of 10-40 in 120 days. Paying the due rent out of the dole or a wage when it is collected
# (rent before food) leaves eviction to those with no income for a week: the jailed, the unpaid, and
# everyone once the Treasury cannot pay the dole.
pay_from_income = true
# The jailed: arrears do not count while inside (the debt still runs and is paid on release). Without
# that, 50 of 67 evictees in 60 days were prisoners and their spouses went with them.

[corps]
# placeholders; one row per corp, niches as a list, holdings as counts per niche kind
# M13 D17 (phase 2): row 9, Zetatech (placeholder name), the Tech corp: it owns the Civic Garage
# (assets::seed_sellers) and, from phase 3, the Spire Clinic.
names    = ["Nutrix", "Vatra", "Greenline", "Habitat", "Stackwell", "Kessler", "Arasaka", "Militech", "Zetatech"]
niches   = [["Food"], ["Food", "Housing"], ["Food"], ["Housing"], ["Housing"], ["Housing"], ["Security"], ["Security", "Housing"], ["Tech"]]
farms    = [6, 4, 2, 0, 0, 0, 0, 0, 0]
markets  = [1, 1, 1, 0, 0, 0, 0, 0, 0]
blocks   = [0, 60, 0, 120, 60, 20, 0, 40, 0]
offices  = [0, 0, 0, 0, 0, 0, 1, 1, 0]
treasury_initial = [6000, 5000, 2500, 8000, 4000, 1500, 4000, 3000, 5000]
# M17 phase 5 (the rename hazard): the seeding roles by row index into `names` above, never by name, so a
# renamed row keeps its role. Fab owners dealt in turn; the Food row the Noodle Bars start from; the seeded
# Labs (owner row, zone, focus) and corp Feeds ("<owner> Now", owner row, zone). Rows 0 Nutrix, 6 Arasaka,
# 7 Militech, 8 Zetatech at the time of writing.
fab_rows = [8, 7]
noodle_first_row = 0
seed_labs = [
  { row = 8, zone = "Spire", track = "Chrome" },
  { row = 8, zone = "Civic", track = "Industry" },
  { row = 6, zone = "Vats", track = "Deck" },
  { row = 7, zone = "Mid", track = "Deck" },
]
seed_feeds = [{ row = 0, zone = "Mid" }]
bar_owner_coins = 200
hoard_heat = 5000                  # a corp treasury above this is a raid prize in the gang brain
acquire_premium = 1.2              # offer = value × premium
acquire_cooldown_days = 10
undercut_floor = 0.6               # price_level cannot be undercut below this
hysteresis = 0.10
shock_severity_rethink = 0.5
# M11 phase 3: 14 -> 3. A corp in the red pays nobody (wages, restock), so its workers walk out and
# its Market's shelf empties (price 30) for as long as it lingers; at 14 the seed-42 run had thefts
# x4 and the M10 throughput gate fell to 5.6k ticks/s, at 7 to 6.9k. At 3 it is sold off (to the city
# at worst, which runs it as in v1) before its workers' wages are a week late.
bankrupt_days = 3
incorporate_buildings = 2         # an agent owning this many becomes a corp
# M11 phase 4: bar 300 -> 200. Seed 42, 2,000, 120 days: wages (5-8) are all above the dole, so only
# the jobless can found, and at 300 never more than two jobless non-execs held 300 at once (most of the
# city's coins sit with the employed and the execs): 3 NPC Bars from day 91 and no incorporation. At
# 200 6 NPC foundings from day 28 and the first incorporation on day 28; at 150 15 foundings (12 Bars
# by day 80, a third of them in a fortnight). Home stays 400 (its value is the Block sale price, D28).
found_cost = { bar = 200, home = 400, hotel = 250, clinic = 500, garage = 600, lab = 800, feed = 500, mission = 150, camp = 600 }  # M12 D20: hotel; M13 D16: clinic, garage; M14: lab (Research only); M15: feed; Real economy E26, E37: mission, camp
wholesale = 2                      # coins per unit Farm → Market when owners differ
# M11 phase 5: 10 -> 20, with upkeep.security_office 30 -> 10. A Security corp costs its Office's
# upkeep, six guards' wages (48) and its exec (10) a day, ~88 at the old sizes against 6-10 a contract
# (Undercut races both to the 0.6 floor): Arasaka could not live on any number of clients it could
# get and died near day 75 on every seed. Now 68 a day: break-even at 3.4 contracts at level 1.0 and
# 5.7 at the floor.
contract_per_guard_day = 20
security_guards = 6
lobby_min_treasury = 400
# M11 phase 3 set both Squeeze ceilings to 1.15 (spec: 2.0 with a monopoly, 1.5 without): the dole
# was one meal at price 3, so any Food markup that rounded 3 up to 4 was a skipped meal for every dole
# agent, and a Winter Food monopoly at the spec caps ran thefts to 3,800 per 10 days. M11 phase 5: the
# dole is 4 (a coin of slack), prices keep their tenths and customers walk to a cheaper Market, so the
# spec caps are back.
monopoly_markup_cap = 2.0          # price_level ceiling with a monopoly
squeeze_cap = 1.5                  # price_level ceiling without a monopoly
# --- M11 plan additions (decisions D4, D11, D15, D17-D25, D28, D33, D41, D48) ---
bar_owner_count = 2
# D4: the Treasury's return flow. M11 phase 2, from the ledger columns over 120 days (seed 42, 2,000):
# the plan's { farm 120, home 3, security_office 60 } left the Treasury -1,140 a day from day 15 (the
# city buys Farm overflow into the Reserve at wholesale, ~1,200 a day, and the dole grows to ~4,900 as
# opening savings run out) and broke it on day 45, so the dole stopped. Farm upkeep carries it, since
# the overflow it pays for is per Farm: 250 overshot (+800 a day, Vatra and Greenline bled out), 215
# with home 3 held days 15-45 flat. With rent [0, 1, 2] a Block earns 0-2, so home 3 bled every
# landlord (Militech 79 a day per 1,000 of treasury against the plan's 50 limit): home 1 and
# security_office 30, and farm 245 makes up the Treasury's share. Result: Treasury 34,618 -> 49,191 in
# 120 days (+121 a day; flat to day 60, then the debt of corps below zero lifts it: no bankruptcy yet).
# M11 phase 3: Block upkeep by tier (Sump, Mid, Spire), was a flat 1. With [rent] base [0, 1, 2] a
# Sump Block earns nothing, so a flat 1 made every Sump landlord (Kessler: 20 Sump Blocks only;
# Stackwell and Militech: 40 each) go bankrupt by arithmetic, not by play. Upkeep now matches the
# tier's base rent: a free Sump Block costs its owner nothing. Corp Block upkeep goes from 300 to
# 260 a day (Habitat's 60 Spire Blocks now pay 2).
# M11 phase 5: security_office 30 -> 10 (see contract_per_guard_day).
# M12 fix pass: hotel 10 -> 4. A Hotel books 2-3 nights a day at 3 coins (5-7 hotel nights a day
# city-wide over 2-3 Hotels, seeds 42-44), ~7 gross and ~6 after tax: at 10 every Hotel owner bled.
# M14 V47 (phase 1): lab 15 -> 0 (third knob; see wage_researcher).
# M15 phase 4: feed 10 -> 0 (as the Lab's in M14 V47): with one Reporter a Feed then nets ~0 a day on ads.
upkeep = { farm = 245, market = 600, bar = 15, home = [0, 1, 2], security_office = 10, hotel = 4, clinic = 10, garage = 10, lab = 0, feed = 0, mission = 0, camp = 2 }  # Real economy E26, E37: a city Mission pays none; a corp's Camp 2 (phase 2's property_rate.camp mirrors it)
# M12 fix pass: a corp raided (or looted by a riot) in the last raided_days reads Secure/Lobby
# `losses` of at least raided_losses: it hardens (contracts the building, or lobbies on the gang).
raided_days = 7
raided_losses = 0.5
value = { farm = 1000, market = 1000, security_office = 500, clinic = 600, garage = 800, lab = 1200, feed = 800, mission = 300, camp = 800 }  # D28; M13 D16; M14; M15; Real economy E26, E37
shop_price_tiles = 12              # D15: one coin of price is worth 12 tiles of walking
grow_cooldown_days = 7             # D23
secure_per_day = 2                 # D24
private_pursuit_radius = 16        # D18
private_beat_tiles = 40            # Shadow V4 bug 11: a private guard's warrants lie this near its office or a client (it chased the city's)
found_cooldown_days = 10           # D26
residents_per_bar = 300            # D25
residents_per_hotel = 800          # M12 D20: Register's Hotel target = population ÷ this
residents_per_clinic = 700         # M13 D16
residents_per_garage = 700         # M13 D16
# M11 phase 5b: 0 -> 0.1. The Found score is greed squared, so a low-greed Bar owner holding 250-355
# coins for 65 days on seed 43 (greed term 0.03) scored Found at 0.01-0.03 against Idle's 0.05-0.15 and
# never founded again; with 0.1 an eligible agent (jobless or self-employed, coins >= found_cost: one
# or two at a time city-wide) acts on it.
found_flat = 0.1
# D33. M11 phase 3: 0.1 -> 0. Nutrix passes hoard_heat by day 5 and at 0.1 the Contest tilt doubled
# both gangs by day 29 (65 members vs 30 with the brain off) and cost the M10 gate ~4% (7.8k ticks/s).
# The term is wired and tested (tests/corps.rs); it waits for M12, where a gang can raid a corp
# building (spec: until then it only tilts Contest).
# M12 phase 4: 0 -> 0.2 (spec § 5). The tilt now lands on the corp-building Raid (plan D39) and no
# longer on Contest (faction::score_orders: Contest reads it only with corp raids off, the M11 brain).
hoard_tilt = 0.2
megacorp = [false, false, false, false, false, false, true, true, false]  # D41; M13 D17 row 9
outside_treasury_initial = 100000
# M11 phase 5, the estate rule (diagnosis item 24): a bankruptcy estate's building goes only to a corp
# already in its niche holding under half of it (Nutrix, a Food corp, bought 60 Blocks of a dead
# landlord; the richest corp swallowed every estate), and one buyer takes at most estate_buyer_cap
# buildings of one estate (one agent bought 41 and incorporated a landlord overnight).
estate_share_cap = 0.5
estate_niche_only = true
estate_buyer_cap = 12
# M11 review, the estate settlement: a building nobody buys is foreclosed by the city at no price (it
# had paid half its value into the bankrupt corp's treasury, which dissolve then handed to the exec:
# one 60-Block landlord's bankruptcy gave ~12,000 city coins to one agent and pushed the Treasury
# negative). The estate's balance then settles: a negative one is absorbed by the Treasury (the corp's
# debt was to the city), a positive one (sales to corps and agents, savings) pays the exec at most
# estate_heir_cap as severance (30 days of wage_exec) and the rest goes to the Treasury.
estate_heir_cap = 300
# M11 phase 5: an incorporated corp starts with its founder's savings (less a day's exec wage) and pays
# no upkeep for 14 days; at treasury 0 Varley Holdings went bankrupt under upkeep 12 days after it
# incorporated.
incorporate_grace_days = 14
# Phase 3 follow-up: Hunker never lays off a Farm's Vat Techs. Phase 5 measured it (config.toml note
# below at hunker_spares_farms' value).
hunker_spares_farms = true
# M11 phase 5: a Housing corp builds a Block only when its own Blocks are 90 % full. With rent back at
# [1, 2, 4] every landlord was in profit and Grow won on 83 % occupancy: 53 corp Blocks on seed 42 by
# day ~90, every Lot gone, three NPC foundings.
grow_min_occupancy = 0.9

[corps.order_flat]                 # D48
# M11 phase 3 (seed 42, 2,000, 120 days): at 0 every landlord took Grow on day 0 (occupancy ~0.83
# reads as demand, 0.43 against Hunker's 0.18) and the thin ones (Kessler 1,070, Militech 2,496)
# spent 400 a week on Sump Blocks nobody moved into, then bled into bankruptcy. -0.15 makes growth
# need a profit: with flow 0 Grow is ~0.28 (no switch from Hunker), with flow 0.5 ~0.46.
grow = -0.15
# M11 phase 3: -0.2. With the dole at one meal at price 3, Food Squeeze to 1.2 is price 4 and a
# skipped meal for every dole agent; at 0 the Food corps squeezed from week 1 and thefts ran 3-4x
# the brain-off run. Squeeze still wins with a dominant share and a greedy exec.
squeeze = -0.2
undercut = 0.0
# M11 phase 3: -0.2. At 0 Nutrix bought a Farm from each weak rival every 10 days, stranding their
# Markets (no supply, no restock money: price 30 for two weeks).
acquire = -0.2
secure = 0.0
hunker = 0.15
# M11 phase 5: 0 -> 0.2. With the economy solvent the corps are richer, so losses / treasury is small
# and Secure (Logistic{8, 0.1} on losses) always outbid Lobby: no corp lobbied on seed 42.
lobby = 0.2
research = 0.05                    # M14 V31: Research needs a nudge to start a Lab
# M14 V31 (phase 3): 0.0 -> 0.3. At 0.0-0.2 no corp took VirtRaid; at 0.3 Arasaka holds it on a few
# stretches and runs Militech's Lab nightly.
virt_raid = 0.3
spin = 0.0                         # M15 W40: Spin is a side spend scored on its own ([news] spin_min)

# M11 classes (docs/M11_OWNERSHIP.md § 7; plan D34-D36).
[classes]
# M11 phase 4: 0.6 -> 0.42. Seed 42: Street unrest runs 0.30-0.46 after day 0 (mean 0.36; fear from
# the patrols holds submission near 0.65), so 0.6 never struck; 0.44 struck once (day 4), 0.42 four
# times in the first month (the 7-day lockout binds), none once unrest eases after day 30.
# M11 phase 5: 0.42 -> 0.45. With rent [1, 2, 4] Street unrest runs 0.27-0.51 (mean 0.38-0.41 on
# seeds 42-44): at 0.42 the city struck 6-15 times in 120 days (every week the lockout allowed), at
# 0.46 0-1 times.
# M12 fix pass: 0.45 / 7 -> 0.52 / 30 days. D41 reads district Street unrest, which runs higher and
# noisier than the city's (Sump West p50 0.46-0.50, p90 0.52-0.55 on seeds 42-44): 0.45 with a
# 7-day per-district lockout struck 28-36 times a run, mostly "1 worker" walkouts in the Sump. At
# 0.51 / 30: 8 / 4 / 3 strikes on seeds 42-44 (band 2-8); 0.52 / 30 gave 7 / 1 / 2, 0.50 / 30 9 / 4 / 3.
strike_threshold = 0.51
strike_cooldown_days = 30
fear_radius = 6
fear_hours_full = 1.0          # guard-hours a day near your Home that read as full fear
couple_immigration = true
immigration_k = 8.0            # Logistic{8, 0.5} over Street happiness; the lever is the ceiling
immigration_mid = 0.5
# M12 fix pass: -0.5 / 7 -> -0.3 / 10. No Dreg's mood held under -0.5 for a week (0 emigrations a
# run); at -0.3 / 7 days 7-10 left, at -0.3 / 8 2-24, at -0.3 / 10 2 / 3 / 7 (band 1-10).
dreg_emigrate_mood = -0.3
dreg_emigrate_days = 10         # 0 = off
evicted_recruit_days = 14
evicted_recruit_lawfulness = 0.5
rent_burden_w = 0.2            # M12 D29: district unrest + rent_burden_w x mean(rent / income) of renters
curfew_fear = 0.2              # M12 D29: submission under a district curfew

[districts]
# M12 § 1. One row per district: name, zone letter, and an x-range inside that
# zone (tiles, cut on road lines). A tile is in the first row whose zone
# matches and whose x_from <= x < x_to.
