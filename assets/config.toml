# Lives at work phase 2 (docs/LIVES_AT_WORK.md § 3): the evening and the household, read by systems/household.rs
# (and leisure.rs for the home spot). Under [lives] enabled (`CITYSIM_HOUSEHOLD_OFF=1`). Placeholders.
[household]
enabled = true
home_w = 0.5                       # § 3.1: a Home spot's score per household member home now ...
child_w = 0.3                      # ... and per child at home (routine not Camp/Street)
visit_hosts = 3                    # § 3.2: Friend/Family contacts' Homes offered as spots when the host is due home
home_dice = false                  # § 3.1: street dice between two bored co-hangers at home (off)
empty_leave_ticks = 20             # § 3.3: a HangOut alone this long ends early with the lone fun ...
empty_penalty = 0.3                # ... and the spot scores x this ...
empty_memory_hours = 6             # ... for this long (Brain.empty_spots)
newborn_days = 30                  # § 3.4: a Birth sets Household.newborn_until on both parents
newborn_away_mult = 0.3            # § 3.4: the carer's away spots and night goals (not Work, Sleep, Eat, Flee) x this
newborn_energy_mult = 1.15         # § 3.4: both parents' energy decay x this
newborn_cost_per_day = 0.5         # § 3.4: Food a day from the Home's pantry (on the child food debt, as a child's)
night_from = 21                    # § 3.4: the carer's night, hours of the day [from, to) ...
night_to = 6
abandon_days = 7                   # § 3.4: a household business with no take this long frees its heir for an outside post
elder_visit_days = 7               # § 3.5: an elder parent (over [ages] frail_from_years) unmet this long is visited
visit_hour_from = 10               # § 3.5: the visit's hour of the day, hashed in [from, to)
visit_hour_to = 20
visit_flat = 0.2                   # § 3.5: the Visit goal's flat bonus (a hurt kin's reason 1.0, an elder's 0.6)
visit_belonging = 0.2              # § 3.5: the visitor's belonging gain (both tiers)

# Lives at work phase 6 (docs/LIVES_AT_WORK.md § 4.1-4.4): ages, careers and the foreman, read by systems/careers.rs,
# under [lives] enabled (`CITYSIM_CAREERS_OFF=1`: [careers] and [roles] unwritten, the trade rows' bands 0). The
# trade rows' bands are their min_age / max_age keys; the legacy roles' are the [roles.<Name>] tables below.
# Placeholders.
[careers]
enabled = true
seniority_cap_years = 30           # § 4.2: a seeded Job's seniority, min(years over the row's min_age (18 none), this)
                                   # x DAYS_PER_YEAR x hash(PURPOSE_TENURE, id) days; 0 for a hire after day 0
foreman_min_age = 30               # § 4.2: the foreman is the most experienced worker (ties the row's skill, the lower id) this old
foreman_premium = 1.25             # § 4.2: the foreman's wage x this (Job.foreman, set at midnight)
profession_min_days = 14           # § 4.3: shifts in a trade before it is the profession (a new trade replaces it at this)
profession_w = 400                 # § 4.3: a holder of the vacancy's profession ranks this many tiles nearer (the offset,
                                   # capped with skill and the rehire bonus at 512); the knowledge floor admits him
retire_from_years = 62             # § 4.4: a worker this old retires (midnight) when an adult child takes him in, or when ...
retire_days = 60                   # ... the household's coins >= this x its daily costs (the mean price x 2 meals x
                                   # residents + the Home's rent a day)
frail_exit_mult = 0.6              # § 4.4: a worker whose [ages] work_mult falls under this is let go "too frail"
unretire_coins = 20                # § 4.4: a retired agent under this many coins is retired no more (the street ladder)

# § 4.1: the legacy roles' hiring age bands (min_age / max_age in years, 0 none).
[roles.Guard]
min_age = 18
max_age = 60

[roles.Fighter]
min_age = 18
max_age = 60

