# Spec § 5 [treasury] (phase 2, plan E13, E14): the property rate replaces [corps] upkeep with wages on
# (Farm 245 and Market 600 a day were a 70 % levy that funded the dole); the Treasury opens with
# treasury_initial and the rest of [world] treasury_initial (35,000 - 12,000 = 23,000) is the seeded
# corps' working capital (econ::seed_capital, pro rata to the day-0 wage bill). tax_* and band are
# phase 3a's tax band (read behind econ::no_net).
[treasury]
