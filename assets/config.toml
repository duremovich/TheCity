[litter]
# M12 § 3 (plan D16-D19, D23-D24). Litter is one byte per street tile, deposited by events (a theft
# 6 r0, an assault or shakedown 12 r1, a violent death 40 r1, an unburied body 24 r0 a day, a brawl
# at a door 32 r2, an eviction 24 r1, a building gone derelict 48 r2, a squat 4 r1 and a rough sleeper
# 2 r0 a night), decayed daily, cleaned by the sweepers, owners and the ruling gang.
# M12 fix pass (the litter scale): a district's `litter` is the share of its street tiles at or above
# `visible` (32, the littered band), not the mean byte over ~30k tiles (which pinned at 0.001 with
# the table's 2-64 deposits). Every deposit is scaled by deposit_mult (8: a theft 48, an assault 96
# trashed with a 48 ring, a death or brawl 254 heaped) and capped at 254; an event inside a building
# lands outside its door. decay 1 and 12 sweepers x clean_per_shift 120 needed no change: the
# dirtiest district holds 0.26-0.28 (in 0.15-0.50 on 96-98 % of days 14-120, seeds 42-44) and the
# Vats under 0.01. Effects stay bounded: a step costs at most step_ticks[3] = 2 ticks more, a Coarse
# walk 1 + timed_mult x share (<= +23 % at 0.46), Sleep safety at most -sleep_penalty (0.15), mood
# -mood x share (<= -0.09), witnesses x (1 - 0.3 x share) (>= 0.86).
enabled = true                     # off() = false: no deposits, no delay, no sanitation
