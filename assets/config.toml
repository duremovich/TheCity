treasury_initial = 12000
# Phase 3a (the net removed; every key below read only with [economy2] wages and no_safety_net on). The
# transition wave, A/B over 120 days on 42/43/44 (starvation deaths; employed d60; population d120; Treasury d120),
# 3a as planned (tax_min 0.05, the opening [levers] rate 0.12, a find paid [life] scavenge_coins 1 from the till,
# the Recycler holding out for parts_price like a Fab): 75/54/86; 676/676/615; 1,801/1,763/1,774; 88k/96k/77k
# (two seeds over 3 x band hi = 75k). Who starved (seed 42, days 10-24, a probe): never-hired adults, 78 % housed
# with an empty pantry and no earner at home, 71 % within reach of a Mission whose larder was empty; no child.
#   tax_initial 0.05 + tax_min 0 alone: 82/70/78; Treasury 47k/48k/35k (the band works; the wave does not move).
#   emigrate_cost 0 alone: 81/86/104, population 894/861/839 (1,023-1,062 leave): the fare is what holds the city.
#   capital_payout_days 10 alone: 66/67/93. [charity] donate_base 0.2, donate_frac 0.2, give_floor_days 3,
#   lobby_gift 400: 24/25/30, meals 16-24 a day, donations 18-20k (ten times the spec's slim band): not kept.
#   The Recycler sells to the World at any bid (the till's dealer, not a Fab; world_market::daily): 36/26/35,
#   but the till hoards 38k by day 120 paying 1 a find. + scrap_coins 3 (the scrap's resale value, ~4 scrap to
#   a 10-16 coin Part): 12/3/1, 680/663/659, 1,809/1,803/1,886, Treasury 109k/115k/101k; scrap_coins 2 + the
#   tax keys below: 13/10/12. Kept: scrap_coins 3 + tax_initial 0.05 + tax_min 0: 6/3/6, 714/699/733,
#   1,842/1,809/1,800, Treasury 40k/57k/44k (the rate reaches 0 by day 38-41: fines, customs and the property
#   rate cover the city's wages); tax_min 0.02 instead: 5/2/6 but Treasury 71k/77k/72k.
tax_min = 0.0                        # plan 0.05 (see above: at 0.05 the Treasury hoards past 3 x band hi)
tax_max = 0.20
tax_step = 0.01
band = [8000, 25000]
# The surplus credit (2026-10-12): with the tax at tax_min and the Treasury held above band hi, the band takes the
# rate past the floor, a tax_step a band_hold_days, down to -credit_max: a negative rate is a credit of -rate on
# every wage paid (economy::collect_wage), paid from the Treasury's coins above band lo only (ownership::tax_credit,
# the tax_credit column). Inside the band a credit eases a step a hold back to tax_min (the Treasury settles at hi);
# under lo it stops at once. Not a safety net: the jobless get nothing; it is the city not hoarding what its capped
# posts can't spend. Why: the city hoarded on main (Treasury 65-85k at d120 and 139-154k at d365 on 42-44, tax 0
# from day 30) and, with the El crews capped (staff_per_line), the fares pooled too (145k at d120, purses -27 %).
# Seeds 42-47 x 120, crews capped, credit_max 0 / 0.15 / 0.25 / 0.35: Treasury d120 145k / 90k / 64k / 57k, purses
# 31.6k / 42.0k / 49.4k / 53.9k (main, uncapped crews: 73.6k, 43.1k), employed 1,396 / 1,489 / 1,503 / 1,516
# (main 1,746). 42-44 x 365, 0.25: the Treasury 13-41k from d150 (main 139-154k), purses 111.6k (main 79.0k);
# 0.35 dips to lo (8k) on two seeds.
credit_max = 0.25
tax_initial = 0.05                   # phase 3a (plan key): the rate a no_net city opens with (negative: [levers] tax_rate)
scrap_coins = 3                      # phase 3a (plan key): a find paid from the Recycler's till with no_net (0: [life] scavenge_coins)
# Flip readiness (the transition wave; no_net): the Recycler's opening float, out of the corps' share of the opening hoard
# (treasury::seed_till before econ::seed_capital; the Treasury keeps its 12,000). Empty, the till pays no find until the
# Recycler's first Parts sale (day 21-24 on seed 42) while ~900 never-hired adults scavenge. With seed_staff_days 5, 42-47 x
# 120 starvation: 0: 194-276; 5,000 (from the Treasury): 165-222 (164-208 with the four-passer beg); 10,000 (from the
# Treasury): 133-187, but the Treasury opened at ~1,850, under the civic band, and the police fell 36 -> 16 on days 2-5;
# 10,000 out of the hoard (kept): 145-205.
till_initial = 10000
# Jobs v2 J16 (P5a; read only with [economy2] wages and no_safety_net on): the civic budget. Each midnight
# target = civic_share x the mean of the last receipts_days days' receipts (tax, fines, customs, property, the El's
# fares net of its power and crews' wages, transit::net_fares: left out, the fares funded the posts only through the hoard term, and the surplus credit cut Sanitation 50 -> 1-25)
# + max(0, Treasury - band hi) / payout_days, spent only above band lo; allocated in order to the police
# ([levers] guard_count up to police_per_1000 x population / 1,000) and Sanitation (sanitation_count up to
# sanitation_max), each x its wage. A headcount drops at most civic_pace a day. Placeholders (spec 5).
civic_share = 0.8
payout_days = 60
receipts_days = 14
police_per_1000 = 35.0
sanitation_max = 50
civic_pace = 5
# P5a (plan risk 8): uncapped by the Jail, the police went to the population ceiling (70) and pinned the Jail at
# its 160 (42-44 x 120: days with >= 155 held 85/58/69 vs 13/38/8 on main; arrests +32 % on 42), and a full Jail
# fines the Vagrancy it cannot hold, so the fines paid for more police. A feedback cap (guard_count x 0.9 x
# capacity / held) swung the police 70 -> 28 -> 69 and, police first, the sweepers 50 -> 0 -> 40 (213 civic
# dismissals on seed 42). So the cap is static: police <= police_per_jail_bed x [buildings] jail capacity. The
# shipped 36 guards hold the Jail at 74-84 % on main's wages city (mean held 119-135 of 160): 0.25 (40) aims at ~90 %.
police_per_jail_bed = 0.25

