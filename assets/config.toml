# P10 (docs/P10_POLICY.md): the city's policy at world creation (the `[economy2] wages` / `no_safety_net`
# switches retired into it). Each item is a saved lever after day 0: `--lever day=D:<key>=on|off` (`levy`,
# `school_meals`, `reserve_release`, `public_works`, `safety_net` for the whole net; the dole is
# `dole_per_day=<n>`), PlayerCommand::SetLevy / SetSchoolMeals / SetReserveRelease / SetPublicWorks /
# SetSafetyNet / SetDolePerDay. The shipped city is the no-net market city; Config::dole_city is the old one.
[policy]
levy = false                         # the M11 wage schedule + corp upkeep levy + L2's band (off: wages from revenue, the tax band)
dole = false                         # the dole at [levers] dole_per_day a day, from the Treasury
public_works = false                 # Sanitation posts opened above the band's top, paid by the Treasury
school_meals = false                 # a child whose pantry is empty eats from the Reserve (Dylan 2026-10-08: none)
reserve_release = false              # the Reserve's free food to a stranded Market (Real economy E32: none)
lapse_days = 7                       # the dole and public works lapse after this many dry days in a row (0: never)

# The Real economy (docs/ECONOMY_V2.md; plan ~/.claude/plans/economy-v2.md). The World market is always on;
# the wage law and the safety net are policy ([policy] above). Every number a placeholder (the late calibration milestone).
[economy2]
emigrate_cost = 20                   # E35 (the jobs round, read only with wages on): fewer coins cannot start emigrating (spec § 10's 20)
# Spec § 5 (phase 2, plan E13-E20): wages from revenue. Each corp's payroll tracks labour_share x its
# 7-day revenue through wage_rev (E17), clamped [wage_floor_mult, wage_cap_mult] and moving wage_step a
# day; a corp under hire_below x the target for 3 days posts a vacancy a building a day while its niche
# demand holds hire_demand, one over fire_above for 7 days at the wage floor lays off its newest (E18).
labour_share = { food = 0.6, housing = 0.4, security = 0.7, tech = 0.55 }
wage_step = 0.03
wage_floor_mult = 0.8
wage_cap_mult = 2.5
shortage_days = 5
hire_below = 0.85
hire_demand = 0.5
fire_above = 1.25
export_staff = 2                     # E18: Farm staff per 100 units of unfilled World Food order
# Phase 2 calibration (the one round the stop rule allows; seed 42, 120 days, the dole on): at the spec's
# placeholders (0.5 / 4 / 8) inputs ran 1.8-2.0k a day against exports of 1.25k (the spec's own band is
# 0.7-1.4k against 1.1-2.2k): the trade balance read -118k over 120 days (87 % of the coin stock), 12 of
# the corps went bankrupt and the city emptied to 280. A/B: inputs off -> pop 826, 5 bankrupt, corps 124k;
# 0.25 / 4 / 8 -> 1.36k a day, -70k, pop 357; 0.15 / 4 / 8 -> 1.18k, -58k, pop 588; 0.15 with power
# halved -> 1.05k, -46k, pop 601; 0.1 / 2 / 4 (kept) -> 767 a day, -12.5k (9 %), pop 652, 6 bankrupt;
# wage_step 0.1 alone -> no gain (the rule overshoots to x1.99 by day 20 and cuts to 0.95 by day 60).
# The Treasury (12,000, no levy) runs dry on day 12 and the dole stops by day 14-18 on every variant:
# nothing inside phase 2's keys funds a 5.5k-a-day dole; see the phase 2 report.
input_per_food = 0.1                 # E13: coins to the World per unit produced (spec 0.5; see above)
input_per_part = 2                   # spec 4
input_per_data = 4                   # spec 8
power = { market = 20, bar = 3, club = 8, arcade = 4, lounge = 15, clinic = 6, garage = 6, lab = 10, fab = 12 }  # E13: a day, to the World
venue_wage_pass = 0.5                # E20: venue prices follow the mean wage_rev at half strength
farm_found_cost = 1000               # E19 (plan deviation): a corp's Farm on World demand (= [corps] value.farm)
# The jobs round (after phase 2's stop rule, option (a): is the wages-on city a no-dole city that holds?). Every
# key read only with wages on; the off values (1.0 / 0 / 30 / 0 / 0 / false, emigrate_cost 0, cap_wages 0)
# reproduce phase 2's wages-on city byte for byte. A/B, 120 days, wages on, `--lever day=0:dole_per_day=0`
# (employed d60 / population d120 / starvation deaths), seed 42 first (base phase 2: 474 / 619 / 60):
#   overflow_paid_only alone 502 / 664 / 57; capital_hi_days 14 alone 499 / 674 / 57; + staff_ceiling_mult 2
#   667 / 783 / 53; asset_import_per_day 300 alone 497 / 678 / 37 (corps hoard 94k); emigrate_cost 20 alone
#   465 / 1,788 / 42 (2 emigrants). All five (hi 14, mult 2): 688 / 1,813 / 41; mult 3: 709 / 1,843 / 36;
#   hi 7 + mult 3: 809 / 1,833 / 32 but Zetatech (d28) and Arasaka (d44) bankrupt: hires made on the payout
#   outlived it (payroll 437-511 against a target of 187-219) -> the shifts past full staff shed first
#   (wages::shed_extra): 777 / 1,859 / 27. Hiring on partial windows from day 1: no gain (757 / 1,854 / 50,
#   Zetatech d24), dropped. The band's floor capital_lo_days 3 (42/43/44): 720-745 / 1,780-1,824 / 31-45,
#   Militech no longer dies; + cap_wages parts 100 / data 30: 767 / 774 / 747, 1,869 / 1,821 / 1,804,
#   33 / 32 / 44, Zetatech survives on 43-44; payout_days 20 (kept): 822 / 909 / 850, 1,796 / 1,823 / 1,821,
#   37 / 31 / 31; mult 4 instead: 744 / 825 / 749; asset cap 200 instead: 732 / 846 / 755.
staff_ceiling_mult = 3.0             # a corp under its margin posts past full_staff up to ceil(full_staff x this) while its target covers the hire
capital_hi_days = 7                  # counter-cyclical capital: working capital above this many days of max(revenue, payroll) ...
capital_payout_days = 20             # ... adds excess / this a day to the payroll target (0 hi days: off)
capital_lo_days = 3                  # the band's floor: under it a corp posts nothing and lays off at once over fire_above (0: off)
# Fleet floor A/B (review round, 42/43/44, dole zeroed; employed d60 / starvation / Farm trucks d30): no floor (corp
# fleets exempt) 565-663 / 56-74 / 12-15; 3: 601-674 / 43-65 / 12-15; 7 (kept): 646-676 / 22-36 / 14-16; 14: 673-745 /
# 25-45 / 11-13; 28: 735-771 / 27-39 / 3 (truck share 0.15: M13's fleet dies). Fleet capped as households (items 1-6):
# 756-787 / 17-33 / 0. The floor trades jobs for trucks; 7 keeps the fleet and the starvation.
fleet_floor_days = 7                 # a corp's fleet purchase (outside the import cap) leaves it this many days of max(revenue, payroll)
asset_import_per_day = 300           # coins of asset imports a corp may front a day (0: unlimited); keeps the opening burst at home
overflow_paid_only = true            # the Reserve buys Farm surplus only from a positive Treasury; the rest stays at the Farm
# household_rent A/B (the wages-on diagnosis's household purse; with the [treasury] 3a keys, 42/43/44): evictions
# 2,257/2,068/2,072 -> 1,447/1,437/1,448, starvation 6/3/6 -> 1/3/10, population 1,842/1,809/1,800 ->
# 1,866/1,791/1,824, but Arasaka bankrupt on 43 (d68) and 44 (d48) and Kessler later (d47): off, a lever for the orchestrator.
# EXPERIMENTAL: measured by the A/B above only, no unit test; test it (conservation, arrears) before turning it on.
household_rent = false               # phase 3a (read only with no_safety_net): a co-resident spouse covers a short rent share before arrears
# Jobs and room P1 (docs/JOBS_V2.md § 3; plan ~/.claude/plans/jobs-v2.md J2, J4; read only with wages on; the off values
# false / 0 / 0 reproduce the jobs round). Placeholders.
raise_on_shortage_only = true        # J2 hire before raise: wage_rev steps up only on a shortage (a vacancy unfilled shortage_days)
skill_w = 0.5                        # J4: the hiring key takes round(skill_w x 100 x the role's skill) tiles off the distance
rehire_bonus = 40                    # J4: tiles off the key for an adult laid off from the same role in the last 30 days
# Flip readiness (the transition wave; read only with wages on): at world creation each corp posts its places up to the
# staffing ceiling while its working capital covers this many days of the added payroll, filled by the hiring key before
# day 0 (wages::seed_staff; 0: off, the dole era's seed: ~22 % of adults employed at day 0, the wallets spent in a week).
# A/B on the no-net city with the Statistical no-net income path, 42-47 x 120 (homeless/adults peak; starvation):
# 0: 0.089-0.123 (the never-hired starve instead: 488-554); 14: 0.062-0.159, 293-380 (820 employed at day 0, the
# capital binds); 5: 0.070-0.098, 224-281 (1,100 employed at day 0, every corp role at its ceiling: 5 does not bind).
seed_staff_days = 5
# Workplace room (2026-10-11; read only with wages on): the places past full staff fit the building's room on their
# shift (staff on one shift <= capacity, less customer_room of it at a Market, a venue, a Clinic, a Garage or a Hotel;
# full staff is never cut). Before it the x3 ceiling staffed Farms with 44-88 in a room of 16, Markets with 36 Clerks
# in a room of 20 and Fabs with 38-56 in 14 (25-28 workplaces a day over their room on seeds 42-44). relief_shift: a
# Farm or Fab whose day shift fills its room hires onto the night shift (shift_night), a second shift's room. Past
# both, the floor pass (AddFloor) and Grow are how a corp adds room.
room_cap = true
customer_room = 0.4
relief_shift = true

# Spec § 3: the World's book per good. At these placeholders the World pays at most ~900 a day for Food
# (350 units, mean bid ~2.6), ~550 for Parts and ~310 for Data at appetite 1.0. Food's ask is 5.4: the
# shelf cannot pass ask + haul_margin (7, rounded up) while the World sells (E12).
# Phase 1 calibration (the plan's "Winter export squeeze" risk, seed 42, 120 days): at the spec's cap 450
# the World outbid the Reserve's wholesale every day, the Reserve drained 20,000 -> 0 by day 119, the one
# poor Food corp's Market could not afford the ask (purse ~1,500, imports ~250 units a day against ~500
# short) and 88 starved on days 118-119 (base 3). Cap 350 (the spec's own "~350 units a day" overflow):
# 0 starved, the Reserve 578 on day 119, export 1,109/day (the spec's 1.1-2.2k band); 250: 3 starved,
# Reserve 6,002, export 899 (under the band); ask x0.5: 89 (the purse binds, not the price); bid_ref 2:
# 0 but export 606. The Reserve still drains over a year: phase 2's Farm overtime and the stop rule read it.
[world_market]
treasury_ref = 50000
revert = 0.05
sd = 0.03
appetite_min = 0.3
appetite_max = 3.0
food  = { bid_ref = 3.4, bid_floor = 1.5, cap = 350, slope = 0.5, spread = 0.6, season = [0.0, -0.15, 0.0, 0.25] }
parts = { bid_ref = 16,  bid_floor = 8,   cap = 40,  slope = 0.4, spread = 0.5, season = [0, 0, 0, 0] }
data  = { bid_ref = 35,  bid_floor = 15,  cap = 12,  slope = 0.5, spread = 0.8, season = [0, 0, 0, 0] }
haul_margin = 1                      # coins a unit over the ask before a Market imports (E11); the shelf's ceiling (E12)
customs_rate = 0.1                   # of an import's price, to the Treasury (E5)
ask_mult = 1.0                       # the famine lever (lower: cheaper imports)
asset_floor = 2                      # E10 (phase 2): chrome/decks kept in a seller's stock before Parts-equivalent export
# The jobs round (export demand; read only with wages on; 0 = the good's own cap): the outside drives demand,
# so a wages city with no dole is carried by what the World buys. Parts 40 -> 100 and Data 12 -> 30 (the Fabs,
# Clinics, Garages and Labs; Food stays 350, phase 1's Winter-squeeze cap) lift export_paid from ~1.05-1.42k
# to 1.67-2.08k a day (inside the spec's 1.1-2.2k band) and keep the Tech corps alive (A/B in [economy2]).
cap_wages = [0, 100, 30]             # [food, parts, data]
# Jobs & lives phase 1 (D6, risk R2; read only with [jobs2] on): the appended books, each a mint capped per
# capita (Config::scaled_to) and printed (rations_paid). The Rations bid is [jobs2] packed_premium x the Food
# bid (bid_ref here is unused for Rations); braindance and organs stay inert until phases 5 and 6.
rations    = { bid_ref = 4.8, bid_floor = 2.0, cap = 150, slope = 0.5, spread = 0.6, season = [0, 0, 0, 0] }
braindance = { bid_ref = 12,  bid_floor = 5,   cap = 20,  slope = 0.5, spread = 0.6, season = [0, 0, 0, 0] }
organs     = { bid_ref = 40,  bid_floor = 20,  cap = 6,   slope = 0.5, spread = 0.8, season = [0, 0, 0, 0] }

