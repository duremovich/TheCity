[package]
name = "citysim"
version.workspace = true
edition.workspace = true

[lib]
# The crate has no doc examples: rustdoc's empty doctest pass cost the change
# tier ~3 s a run (2026-10-19, the Lives at work gate's budget).
doctest = false

[features]
# Scale S1: the wall-time profiler (`prof.rs`), off by default.
prof = []

[dependencies]
rand = "0.9"
rand_chacha = { version = "0.9", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = { version = "0.10", features = ["integer128"] }
toml = "0.8"
smallvec = { version = "1", features = ["serde"] }
ordered-float = { version = "5", features = ["serde"] }

[dev-dependencies]
blake3 = "1"
criterion = "0.5"

[[bench]]
name = "tick"
harness = false
