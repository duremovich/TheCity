[package]
name = "glclient"
version = "0.1.0"
edition = "2024"
publish = false
description = "Gutterlight client rules: blocks of building glbs on a street, the cutaway, the block nav, the session-16 light rules (Bevy)"

# Build through a root crate that carries the vendored Bevy 0.19.1 fixes (engine/lighttest's [patch.crates-io]):
# shadow views of hidden / culled lights leak, ortho volumetric fog, shadow-view schedule cost.
[dependencies]
bevy = { version = "0.19.1", features = ["area_light_luts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# kit streams (P6): zlib blobs
flate2 = "1"
